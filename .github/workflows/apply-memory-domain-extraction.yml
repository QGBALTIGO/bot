name: Apply memory domain extraction

on:
  push:
    branches:
      - v2/p1-memory-domain
    paths:
      - .github/workflows/apply-memory-domain-extraction.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-memory-domain
          fetch-depth: 0

      - name: Install test runner
        run: python -m pip install -q pytest

      - name: Apply surgical extraction
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))

          removable_names = {
              'memory_page',
              'memory_alias',
              'api_memory_best',
              'api_memory_finish',
          }
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name in removable_names
          }
          missing = removable_names - functions.keys()
          if missing:
              raise SystemExit(f'Abortando: funções esperadas ausentes: {sorted(missing)}')

          owners = [
              (node.lineno, node.end_lineno or node.lineno, node.name)
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]

          def owner_for(lineno: int) -> str:
              for start, end, name in owners:
                  if start <= lineno <= end:
                      return name
              return '<module>'

          # Alias /memory é o único consumidor esperado da função memory_page.
          memory_page_uses = [
              (node.lineno, owner_for(node.lineno))
              for node in ast.walk(tree)
              if isinstance(node, ast.Name)
              and node.id == 'memory_page'
              and isinstance(node.ctx, ast.Load)
          ]
          outside_page = [
              item for item in memory_page_uses if item[1] not in {'memory_alias'}
          ]
          if outside_page:
              raise SystemExit(f'Abortando: memory_page possui consumidores externos: {outside_page}')

          builder_uses = [
              (node.lineno, owner_for(node.lineno))
              for node in ast.walk(tree)
              if isinstance(node, ast.Name)
              and node.id == 'build_memory_page_html'
              and isinstance(node.ctx, ast.Load)
          ]
          outside_builder = [
              item for item in builder_uses if item[1] != 'memory_page'
          ]
          if outside_builder:
              raise SystemExit(
                  f'Abortando: build_memory_page_html possui consumidores externos: {outside_builder}'
              )

          lines = text.splitlines(keepends=True)
          ranges = []
          for name, node in functions.items():
              start = min([d.lineno for d in node.decorator_list] + [node.lineno])
              end = node.end_lineno or node.lineno
              ranges.append((start, end, name))
          for start, end, _ in sorted(ranges, reverse=True):
              del lines[start - 1:end]

          new_text = ''.join(lines)
          builder_import = '    build_memory_page as build_memory_page_html,\n'
          if new_text.count(builder_import) != 1:
              raise SystemExit(
                  f'Abortando: import do builder do Memory não é único: {new_text.count(builder_import)}'
              )
          new_text = new_text.replace(builder_import, '', 1)

          parsed = ast.parse(new_text, filename=str(path))
          remaining_defs = {
              node.name
              for node in parsed.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked = removable_names & remaining_defs
          if leaked:
              raise SystemExit(f'Abortando: funções legadas permaneceram: {sorted(leaked)}')

          builder_loads = [
              node.lineno
              for node in ast.walk(parsed)
              if isinstance(node, ast.Name)
              and node.id == 'build_memory_page_html'
              and isinstance(node.ctx, ast.Load)
          ]
          if builder_loads:
              raise SystemExit(
                  f'Abortando: referência ao builder legado permaneceu: {builder_loads}'
              )

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes webapp_services utils
          python -m pytest -q \
            tests/test_memory_service.py \
            tests/test_memory_domain_architecture.py \
            tests/test_collection_domain_architecture.py \
            tests/test_webapp_auth_invariants.py \
            tests/test_webapp_route_modularization.py

      - name: Commit final refactor
        run: |
          rm .github/workflows/apply-memory-domain-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrair domínio Memory [memory-domain-extracted]"
          git push origin HEAD:v2/p1-memory-domain
