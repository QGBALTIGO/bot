name: Inspect profile collection helper

on:
  push:
    branches:
      - v2/p1-webapp-profile-collection

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-profile-collection
          fetch-depth: 0

      - name: Inspect helper sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text, filename=str(path))

          targets = {'_web_image_url', '_menu_collection_characters', '_menu_user_payload'}
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) or node.name not in targets:
                  continue
              calls = sorted({
                  child.func.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Name)
              })
              print(f'=== {node.name} {node.lineno}-{node.end_lineno}; calls={calls} ===')
              for i in range(node.lineno, (node.end_lineno or node.lineno) + 1):
                  print(f'{i:05d}: {lines[i-1]}')
              print()
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-profile-collection-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de coleção [profile-collection-inspection-done]"
          git push origin HEAD:v2/p1-webapp-profile-collection
