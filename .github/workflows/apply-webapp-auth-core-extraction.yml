name: Apply WebApp auth core extraction

on:
  push:
    branches:
      - v2/p1-webapp-auth-core

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[webapp-auth-extracted]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-auth-core
          fetch-depth: 0

      - name: Apply surgical extraction
        run: python scripts/apply_webapp_auth_core_extraction.py

      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extrair auth core do webapp [webapp-auth-extracted]"
          git push origin HEAD:v2/p1-webapp-auth-core
