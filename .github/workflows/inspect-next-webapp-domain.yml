name: Inspect next WebApp domain

on:
  push:
    branches:
      - v2/p1-next-domain-map
    paths:
      - .github/workflows/inspect-next-webapp-domain.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-next-domain-map
          fetch-depth: 0

      - name: Map remaining WebApp monolith
        run: |
          python - <<'PY'
          import ast
          from collections import defaultdict
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))

          routes = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for decorator in node.decorator_list:
                  if not isinstance(decorator, ast.Call) or not isinstance(decorator.func, ast.Attribute):
                      continue
                  if not decorator.args or not isinstance(decorator.args[0], ast.Constant):
                      continue
                  route = decorator.args[0].value
                  if not isinstance(route, str):
                      continue
                  method = decorator.func.attr.upper()
                  if method not in {'GET','POST','PUT','PATCH','DELETE'}:
                      continue
                  start = min([d.lineno for d in node.decorator_list] + [node.lineno])
                  end = node.end_lineno or node.lineno
                  span = end - start + 1
                  routes.append((route, method, node.name, span, start, end))

          groups = defaultdict(list)
          for item in routes:
              route = item[0]
              parts = [p for p in route.split('/') if p]
              if not parts:
                  group = '/'
              elif parts[0] == 'api' and len(parts) >= 2:
                  group = '/api/' + parts[1]
              else:
                  group = '/' + parts[0]
              groups[group].append(item)

          print('=== ROUTE GROUPS ===')
          for group, items in sorted(
              groups.items(),
              key=lambda kv: (-sum(x[3] for x in kv[1]), -len(kv[1]), kv[0]),
          ):
              total = sum(x[3] for x in items)
              print(f'{group}: routes={len(items)} route_lines={total}')
              for route, method, name, span, start, end in sorted(items, key=lambda x: -x[3]):
                  print(f'  {method:6} {route:48} {name:40} lines={span:4} @{start}-{end}')

          large = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  start, end = node.lineno, node.end_lineno or node.lineno
                  large.append((end-start+1, type(node).__name__, node.name, start, end))
              elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                  start, end = node.lineno, node.end_lineno or node.lineno
                  names = []
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name):
                          names.append(target.id)
                  if names:
                      large.append((end-start+1, type(node).__name__, ','.join(names), start, end))

          print('=== LARGEST TOP-LEVEL NODES ===')
          for span, kind, name, start, end in sorted(large, reverse=True)[:40]:
              print(f'{span:5} {kind:16} {name:50} @{start}-{end}')

          print(f'=== FILE LINES {len(text.splitlines())} ===')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-next-webapp-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover mapa temporário de domínios [next-domain-mapped]"
          git push origin HEAD:v2/p1-next-domain-map
