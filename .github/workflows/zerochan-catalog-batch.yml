name: Zerochan catalog batch

on:
  push:
    branches:
      - test-zerochan-curator-v2
    paths:
      - 'scripts/curate_zerochan_catalog.py'
      - '.github/workflows/zerochan-catalog-batch.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many not-yet-finished characters to inspect'
        required: false
        default: '30'
        type: string
      detail_limit:
        description: 'Detailed Zerochan entries checked per tag'
        required: false
        default: '2'
        type: string

permissions:
  contents: write

concurrency:
  group: zerochan-catalog-curator
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZEROCHAN_USERNAME: RyuOni767
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-zerochan-curator-v2
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check httpx
      - name: Curate next catalog batch
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit || '2' }}
        run: |
          python scripts/curate_zerochan_catalog.py \
            --batch-size "$BATCH_SIZE" \
            --detail-limit "$DETAIL_LIMIT" \
            --max-attempts 3 \
            --checkpoint-every 5
      - name: Show catalog progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/zerochan_curation_state.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print('ZEROCHAN_PROGRESS', json.dumps(data.get('stats') or {}, sort_keys=True))
          PY
      - name: Persist candidate and state files on test branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/zerochan_character_candidates.json data/zerochan_curation_state.json
          if git diff --cached --quiet; then
            echo 'No curator state changes to commit.'
            exit 0
          fi
          git commit -m 'data: advance Zerochan character curation'
          git fetch origin test-zerochan-curator-v2
          git rebase origin/test-zerochan-curator-v2
          git push origin HEAD:test-zerochan-curator-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerochan-catalog-state
          path: |
            data/zerochan_character_candidates.json
            data/zerochan_curation_state.json
          retention-days: 7
