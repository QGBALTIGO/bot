name: Apply Wallhaven local portrait filtering

on:
  push:
    paths:
      - ".github/workflows/apply-wallhaven-search-shape.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/patch_wallhaven_search_shape.py
      - name: Validate
        run: |
          python -m compileall -q scripts/curate_wallhaven_characters.py
          git diff --check
          grep -q 'RATIO_TOLERANCE = 0.045' scripts/curate_wallhaven_characters.py
          grep -q 'def _search_shape_ok' scripts/curate_wallhaven_characters.py
          ! grep -A15 'def search_candidates' scripts/curate_wallhaven_characters.py | grep -q '"ratios": "2x3"'
      - name: Remove temporary files
        run: |
          rm -f scripts/patch_wallhaven_search_shape.py
          rm -f .github/workflows/apply-wallhaven-search-shape.yml
          rm -f .github/workflows/wallhaven-query-diagnostics.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Filter near-2x3 Wallhaven portraits locally"
          git push origin HEAD:main
