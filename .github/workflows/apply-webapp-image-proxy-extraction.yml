name: Apply WebApp image proxy extraction

on:
  push:
    branches:
      - v2/p1-webapp-routes

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[webapp-route-extracted]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-routes
          fetch-depth: 0

      - name: Apply surgical extraction
        run: python scripts/apply_webapp_image_proxy_extraction.py

      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extrair rota de proxy do webapp [webapp-route-extracted]"
          git push origin HEAD:v2/p1-webapp-routes
