name: AniNexus duel social once

on:
  push:
    branches:
      - v2/aninexus-duel-social

permissions:
  contents: write

concurrency:
  group: aninexus-duel-social-once
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/aninexus-duel-social

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Normalize compatibility marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare_aninexus_duel_social.py')
          text = path.read_text(encoding='utf-8')
          old = '''entry = replace_once(
              entry,
              "        \\\"/api/v1_7b82/social/marriage\\\",\\n",
              "",
              "remove marriage compat path",
          )'''
          # Keep this defensive edit tolerant to the exact indentation stored in the script.
          generic = '''entry = replace_once(
              entry,
              "        \\\"/api/v1_7b82/social/marriage\\\",\\n",
              "",
              "remove marriage compat path",
          )'''
          specific = '''entry = replace_once(
              entry,
              """    aninexus_compat_paths = {\n        "/api/v1_7b82/secure_init",\n        "/api/v1_7b82/harem",\n        "/api/v1_7b82/rarities",\n        "/api/v1_7b82/social/marriage",\n    }\n""",
              """    aninexus_compat_paths = {\n        "/api/v1_7b82/secure_init",\n        "/api/v1_7b82/harem",\n        "/api/v1_7b82/rarities",\n    }\n""",
              "remove marriage compat path",
          )'''
          if generic in text:
              text = text.replace(generic, specific, 1)
          else:
              target = '''entry = replace_once(
              entry,
              "        \\"/api/v1_7b82/social/marriage\\",\\n",
              "",
              "remove marriage compat path",
          )'''
              if target not in text:
                  raise SystemExit('Generic marriage removal block not found')
              text = text.replace(target, specific, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply duel and social patch
        run: python scripts/prepare_aninexus_duel_social.py

      - name: Compile Python
        run: python -m compileall -q .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run duel social contracts
        run: python -m pytest -q tests/test_aninexus_duel_social_contracts.py

      - name: Install frontend dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: aninexus_frontend
        run: bun run build

      - name: Check high visibility Portuguese copy
        shell: bash
        run: |
          if grep -nE 'Milestones|Bragging rights|Keep hatching|No Missions Available|DAILY OPERATIONS|STRATEGIC WEEKLY|Active pet|All pets|Sorted by level|Active Companion|SYSTEM_SUPPORT_PERK' \
            aninexus_frontend/src/pages/Achievements.tsx \
            aninexus_frontend/src/pages/Quests.tsx \
            aninexus_frontend/src/pages/MyPets.tsx \
            aninexus_frontend/src/components/pet/PetActionModal.tsx; then
            echo 'High visibility English copy remains.'
            exit 1
          fi

      - name: Publish runtime
        run: |
          rm -rf aninexus_runtime
          cp -R aninexus_frontend/dist aninexus_runtime
          test -f aninexus_runtime/index.html
          test -d aninexus_runtime/assets

      - name: Remove one-time files
        run: |
          rm -f scripts/prepare_aninexus_duel_social.py
          rm -f .github/workflows/aninexus-duel-social-once.yml

      - name: Commit generated platform
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrar duelos e vínculos à MiniApp AniNexus'
          git push origin HEAD:v2/aninexus-duel-social
