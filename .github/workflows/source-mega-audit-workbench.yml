name: Source mega audit workbench
on:
  push:
    branches: [codex/source-mega-audit-20260925]
    paths: ['.github/workflows/source-mega-audit-workbench.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Source snapshot
        run: |
          mkdir -p /tmp/source-audit-baseline
          git archive --format=tar.gz HEAD > /tmp/source-audit-baseline/source.tar.gz
          git rev-parse HEAD > /tmp/source-audit-baseline/revision.txt
      - name: Install audit tools
        run: |
          pip install -q -r requirements.txt pytest pytest-asyncio pytest-cov ruff bandit pip-audit
          cd aninexus_frontend && bun install --frozen-lockfile
      - name: Baseline Python tests and measured coverage
        run: |
          set +e
          python -m pytest -q --cov=. --cov-report=json:/tmp/source-audit-baseline/coverage.json --cov-report=term > /tmp/source-audit-baseline/pytest.txt 2>&1
          echo $? > /tmp/source-audit-baseline/pytest-exit.txt
          ruff check . --select E9,F63,F7,F82 --exclude data --output-format=json > /tmp/source-audit-baseline/ruff.json
          bandit -r . -x ./tests,./aninexus_frontend/node_modules,./.git -f json -o /tmp/source-audit-baseline/bandit.json >/tmp/source-audit-baseline/bandit-summary.txt 2>&1
          pip-audit -r requirements.txt --format=json --output=/tmp/source-audit-baseline/pip-audit.json >/tmp/source-audit-baseline/pip-audit-summary.txt 2>&1
          exit 0
      - name: Baseline frontend build and dependency review
        run: |
          set +e
          cd aninexus_frontend
          bun run build >/tmp/source-audit-baseline/frontend-build.txt 2>&1
          echo $? >/tmp/source-audit-baseline/frontend-build-exit.txt
          diff -qr dist ../aninexus_runtime > /tmp/source-audit-baseline/runtime-diff.txt
          bun audit --json > /tmp/source-audit-baseline/frontend-audit.json 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-baseline
          path: /tmp/source-audit-baseline/
          retention-days: 2
