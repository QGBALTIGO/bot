name: Source UI workbench

on:
  push:
    branches: [codex/unify-source-webapps-20260925]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ui-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile
      - name: Compile the frontend
        working-directory: aninexus_frontend
        run: bun run build
      - name: Package isolated source and build dependencies
        if: always()
        run: |
          tar --exclude='./.git' --exclude='*.session' --exclude='*.session-journal' --exclude='./.env' --exclude='./data' -czf /tmp/source-ui-workbench.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-ui-workbench
          path: /tmp/source-ui-workbench.tar.gz
          retention-days: 1
