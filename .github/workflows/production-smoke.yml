name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke dependency
        run: python -m pip install httpx

      - name: Wait for Source production health and safe catalog
        env:
          SOURCE_PRODUCTION_URL: "https://bot-production-1980.up.railway.app"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import time
          import httpx

          base = os.environ["SOURCE_PRODUCTION_URL"].rstrip("/")
          expected = os.environ.get("EXPECTED_SHA", "")[:12]
          last_error = "not-started"

          def require_catalog(client):
              expected_animes = {
                  "Naruto": (20, 82),
                  "Witch Hat Atelier": (147105, 14),
              }
              for query, (expected_id, expected_total) in expected_animes.items():
                  found_response = client.get(base + "/api/cards/find-anime", params={"q": query})
                  if found_response.status_code != 200:
                      raise RuntimeError(f"find_anime_{expected_id}_http_{found_response.status_code}")
                  found = found_response.json()
                  anime = found.get("anime") or {}
                  anime_id = int(anime.get("anime_id") or 0)
                  if found.get("ok") is not True or anime_id != expected_id:
                      raise RuntimeError(f"find_anime_{expected_id}_missing:{found}")

                  chars_response = client.get(
                      base + "/api/cards/characters",
                      params={"anime_id": expected_id, "limit": 5000},
                  )
                  if chars_response.status_code != 200:
                      raise RuntimeError(f"characters_{expected_id}_http_{chars_response.status_code}")
                  chars = chars_response.json()
                  total = int(chars.get("total") or 0)
                  if chars.get("ok") is not True or total != expected_total:
                      raise RuntimeError(
                          f"characters_{expected_id}_count:{total}!={expected_total}"
                      )
                  print(f"catalog_ok anime={query!r} id={expected_id} characters={total}")

          def require_collecting_dispatch(client):
              # No credentials or user identity: every probe must be rejected before
              # business logic. The actor's detail differs from the legacy fallback.
              # A 401 alone was insufficient to detect the previous routing bug.
              placeholder = "00000000-0000-4000-8000-000000000001"
              probes = [("PATCH", "/settings")] + [("POST", path) for path in (
                  "/wishes", "/wishes/work/1", "/workshop/preview",
                  "/workshop/recycle", "/workshop/craft", "/daily/claim",
                  "/daily/milestone", "/market", f"/market/{placeholder}/action",
                  f"/market/{placeholder}/settle", "/events",
                  f"/events/{placeholder}/publish", f"/events/{placeholder}/contribute",
                  f"/events/{placeholder}/claim", "/identify",
              )]
              for method, path in probes:
                  response = client.request(method, base + "/api/v1_7b82/collecting" + path, json={})
                  if response.status_code != 401 or response.json() != {"detail": "Sessão expirada. Reabra a MiniApp."}:
                      raise RuntimeError(f"collecting_dispatch_{method}_{path}_http_{response.status_code}")
                  print(f"collecting_auth_guard_ok method={method} path={path} status=401")

          def require_aninexus_bridge(client):
              private_probes = [
                  ("GET", "/api/v1_7b82/integrations/aninexus/status"),
                  ("POST", "/api/v1_7b82/integrations/aninexus/link-token"),
              ]
              for method, path in private_probes:
                  response = client.request(method, base + path, json={} if method == "POST" else None)
                  body = response.json()
                  if response.status_code != 401 or body.get("detail") != "Sessão expirada. Reabra a MiniApp.":
                      raise RuntimeError(f"aninexus_private_bridge_{method}_{path}_{response.status_code}:{body}")
                  print(f"aninexus_private_bridge_ok method={method} path={path}")

              consume = client.post(base + "/api/integrations/aninexus/consume", json={"token": "invalid-one-time-token-for-production-smoke"})
              consume_body = consume.json()
              if consume.status_code != 410 or "expirou" not in str(consume_body.get("detail") or "").lower():
                  raise RuntimeError(f"aninexus_consume_guard_{consume.status_code}:{consume_body}")
              profile = client.get(base + "/api/integrations/aninexus/profile/00000000-0000-4000-8000-000000000001")
              if profile.status_code != 404:
                  raise RuntimeError(f"aninexus_profile_guard_{profile.status_code}:{profile.text[:200]}")
              print("aninexus_public_bridge_guards_ok")

          with httpx.Client(
              timeout=15.0,
              follow_redirects=True,
              headers={"User-Agent": "SourceBaltigo-Production-Smoke/4.0"},
          ) as client:
              for attempt in range(1, 25):
                  try:
                      response = client.get(base + "/health")
                      body = response.json() if response.headers.get("content-type", "").startswith("application/json") else {}
                      version = str(body.get("version") or "unknown")
                      healthy = response.status_code == 200 and body.get("ok") is True
                      version_ok = version == "unknown" or not expected or version == expected

                      print(
                          f"attempt={attempt} status={response.status_code} "
                          f"healthy={healthy} version={version} expected={expected}"
                      )

                      if healthy and version_ok:
                          root = client.get(base + "/")
                          if root.status_code != 200:
                              raise RuntimeError(f"root_http_{root.status_code}")
                          require_catalog(client)
                          require_collecting_dispatch(client)
                          require_aninexus_bridge(client)
                          print("Production smoke passed")
                          raise SystemExit(0)

                      if healthy and not version_ok:
                          last_error = f"deployment_stale:{version}!={expected}"
                      else:
                          last_error = f"health_http_{response.status_code}:{body}"
                  except SystemExit:
                      raise
                  except Exception as exc:
                      last_error = f"{type(exc).__name__}:{exc}"
                      print(f"attempt={attempt} error={last_error}")

                  if attempt < 24:
                      time.sleep(15)

          raise SystemExit(f"Production smoke failed: {last_error}")
          PY
