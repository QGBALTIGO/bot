name: Map Seal frontend API once

on:
  push:
    branches:
      - v2/seal-fusion
    paths:
      - .github/workflows/map-seal-api-once.yml

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/seal-fusion
          fetch-depth: 0

      - name: Generate frontend compatibility inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/src')
          files = sorted(root.rglob('*.ts')) + sorted(root.rglob('*.tsx'))

          endpoint_patterns = [
              re.compile(r"apiFetch\(\s*['\"]([^'\"]+)['\"]"),
              re.compile(r"useApi(?:<[^>]+>)?\(\s*['\"]([^'\"]+)['\"]"),
              re.compile(r"useInfiniteGrid(?:<[^>]+>)?\(\s*['\"]([^'\"]+)['\"]"),
          ]

          endpoints = {}
          branding = []
          pages = []
          components = []

          for path in files:
              text = path.read_text(encoding='utf-8')
              rel = path.as_posix()
              for pattern in endpoint_patterns:
                  for match in pattern.finditer(text):
                      endpoint = match.group(1)
                      endpoints.setdefault(endpoint, set()).add(rel)
              for lineno, line in enumerate(text.splitlines(), 1):
                  if re.search(r'\bseal\b|SEAL YOUR WAIFU|Seal Your Waifu', line, re.I):
                      branding.append((rel, lineno, line.strip()[:180]))

          pages_dir = root / 'pages'
          if pages_dir.exists():
              pages = sorted(p.name for p in pages_dir.glob('*.tsx'))
          components_dir = root / 'components'
          if components_dir.exists():
              components = sorted(p.relative_to(root).as_posix() for p in components_dir.rglob('*.tsx'))

          lines = [
              '# Seal frontend compatibility inventory',
              '',
              'Generated from the imported upstream frontend. This is the completeness checklist for Source Baltigo compatibility.',
              '',
              f'- Pages: **{len(pages)}**',
              f'- React components: **{len(components)}**',
              f'- Literal API endpoints discovered: **{len(endpoints)}**',
              f'- Seal branding occurrences: **{len(branding)}**',
              '',
              '## Pages',
              '',
          ]
          lines.extend(f'- `{page}`' for page in pages)
          lines.extend(['', '## API endpoints', ''])
          for endpoint in sorted(endpoints):
              callers = ', '.join(f'`{p}`' for p in sorted(endpoints[endpoint]))
              lines.append(f'- `{endpoint}` — {callers}')

          lines.extend(['', '## Components', ''])
          lines.extend(f'- `{component}`' for component in components)

          lines.extend(['', '## Branding occurrences to adapt', ''])
          for rel, lineno, snippet in branding:
              safe = snippet.replace('`', '\\`')
              lines.append(f'- `{rel}:{lineno}` — `{safe}`')

          Path('docs/SEAL_FRONTEND_COMPATIBILITY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/map-seal-api-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: inventariar superfície completa do frontend Seal"
          git push origin HEAD:v2/seal-fusion
