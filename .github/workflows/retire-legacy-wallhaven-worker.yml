name: Retire legacy Wallhaven runtime curator

on:
  push:
    paths:
      - '.github/workflows/retire-legacy-wallhaven-worker.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Retire legacy worker
        run: python scripts/retire_legacy_wallhaven_worker.py
      - name: Validate runtime wiring
        run: |
          python -m compileall -q bot.py utils/wallhaven_legacy_cleanup.py utils/wallhaven_bulk_curator.py
          python - <<'PY'
          from pathlib import Path
          bot=Path('bot.py').read_text(encoding='utf-8')
          legacy=Path('utils/wallhaven_bulk_curator.py').read_text(encoding='utf-8')
          assert 'wallhaven_bulk_curator_worker' not in bot
          assert 'cleanup_legacy_wallhaven_global_images' in bot
          assert 'WALLHAVEN_LEGACY_CURATOR_ENABLED' in legacy
          assert 'WALLHAVEN_CURATOR_ENABLED' not in legacy
          assert '"0"' in legacy.split('WALLHAVEN_LEGACY_CURATOR_ENABLED',1)[1][:120]
          PY
          git diff --check
      - name: Remove one-shot files
        run: |
          rm -f scripts/retire_legacy_wallhaven_worker.py
          rm -f .github/workflows/retire-legacy-wallhaven-worker.yml
      - name: Commit retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Retire legacy Wallhaven runtime curator'
          git push origin HEAD:main
