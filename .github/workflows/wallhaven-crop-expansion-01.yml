name: Expand Wallhaven curated portraits with crop

on:
  push:
    paths:
      - '.github/workflows/wallhaven-crop-expansion-01.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Reprocess first 50 priority characters with crop-aware rules
        env:
          WALLHAVEN_API_KEY: ${{ secrets.WALLHAVEN_API_KEY }}
          WALLHAVEN_CURATOR_DELAY: '1.45'
        run: python scripts/curate_wallhaven_characters.py --offset 0 --limit 50 --apply --retry-misses
      - name: Validate curated set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/wallhaven_character_overrides.json').read_text(encoding='utf-8'))
          chars=d.get('characters') or {}
          print('TOTAL_CURATED',len(chars))
          for cid,row in chars.items():
              assert not (row.get('other_characters') or []), (cid,row.get('other_characters'))
              w=int(row.get('width') or 0); h=int(row.get('height') or 0)
              assert w>=1000 and h>=1500 and w<h, (cid,w,h)
              ratio=w/h
              assert 0.55 <= ratio <= 0.80, (cid,ratio)
              retention=min((2/3)/ratio, ratio/(2/3))
              assert retention >= 0.82, (cid,retention)
              assert float(row.get('score') or 0)>=82
          PY
          git diff --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/wallhaven-crop-expansion-01.yml
      - name: Commit curated portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wallhaven_character_overrides.json data/wallhaven_curation_state.json .github/workflows/wallhaven-crop-expansion-01.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Expand crop-aware Wallhaven character portraits'
          git push origin HEAD:main
