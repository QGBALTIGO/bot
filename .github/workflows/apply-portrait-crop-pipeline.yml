name: Apply exact 2x3 portrait crop pipeline

on:
  push:
    paths:
      - ".github/workflows/apply-portrait-crop-pipeline.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pillow httpx pytest
      - name: Apply crop integration
        run: python scripts/apply_portrait_crop_pipeline.py
      - name: Validate exact portrait pipeline
        run: |
          python -m compileall -q webapp.py utils/portrait_image.py scripts/curate_wallhaven_characters.py
          python -m pytest -q tests/test_portrait_image.py
          git diff --check
          grep -q 'crop=portrait' webapp.py
          grep -q 'crop_portrait_bytes' webapp.py
          grep -q 'MIN_SOURCE_RATIO = 0.55' scripts/curate_wallhaven_characters.py
          grep -q 'MAX_SOURCE_RATIO = 0.80' scripts/curate_wallhaven_characters.py
          grep -q 'MIN_CROP_RETENTION = 0.82' scripts/curate_wallhaven_characters.py
      - name: Remove one-shot files
        run: |
          rm -f scripts/apply_portrait_crop_pipeline.py
          rm -f .github/workflows/apply-portrait-crop-pipeline.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Crop curated character portraits to exact 2x3"
          git push origin HEAD:main
