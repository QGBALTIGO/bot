name: Source audit recovery snapshot
on:
  push:
    branches: [codex/source-deep-audit-20260925]
    paths: ['.github/workflows/source-audit-recovery-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > /tmp/source-audit-recovery.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit-recovery-source
          path: /tmp/source-audit-recovery.tar.gz
          retention-days: 1
