name: Inspect menu dead UI

on:
  push:
    branches:
      - v2/p1-menu-dead-ui
    paths:
      - .github/workflows/inspect-menu-dead-ui.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-menu-dead-ui
          fetch-depth: 0

      - name: Inspect menu legacy symbols
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))
          symbols = {'MENU_HTML', 'MENU_BACKGROUND_URL', 'MENU_BANNER_URL'}

          for symbol in sorted(symbols):
              defs = []
              loads = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Name) and node.id == symbol:
                      if isinstance(node.ctx, ast.Store):
                          defs.append(node.lineno)
                      elif isinstance(node.ctx, ast.Load):
                          loads.append(node.lineno)
              print(f'{symbol}: defs={defs} loads={loads}')

          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  names = []
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id in symbols:
                          names.append(target.id)
                  if names:
                      print(f'ASSIGN {names} {node.lineno}-{node.end_lineno}')
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'menu_page':
                  print(f'FUNCTION menu_page {node.lineno}-{node.end_lineno}')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-menu-dead-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária do menu legado [menu-dead-ui-inspected]"
          git push origin HEAD:v2/p1-menu-dead-ui
