name: Export audit source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - audit/main-production-hardening-2026-09-01
    paths:
      - .github/workflows/export-audit-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-snapshot
          path: |
            **/*.py
            **/*.yml
            **/*.yaml
            **/*.toml
            **/*.ini
            **/*.cfg
            requirements.txt
            README.md
            .gitignore
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
