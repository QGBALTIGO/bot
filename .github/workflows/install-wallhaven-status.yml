name: Install Wallhaven curator diagnostics

on:
  push:
    paths:
      - 'scripts/install_wallhaven_status_route.py'
      - '.github/workflows/install-wallhaven-status.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/install_wallhaven_status_route.py
      - run: |
          python -m compileall -q webapp.py utils/wallhaven_curator_status.py utils/wallhaven_bulk_curator.py
          git diff --check
          grep -q 'wallhaven_curator_status_router' webapp.py
      - run: |
          rm -f scripts/install_wallhaven_status_route.py
          rm -f .github/workflows/install-wallhaven-status.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Expose aggregate Wallhaven curator status'
          git push origin HEAD:main
