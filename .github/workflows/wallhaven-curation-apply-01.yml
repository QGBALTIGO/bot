name: Wallhaven curation apply 01

on:
  push:
    paths:
      - ".github/workflows/wallhaven-curation-apply-01.yml"

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install httpx
      - name: Apply strict priority batch
        env:
          WALLHAVEN_API_KEY: ${{ secrets.WALLHAVEN_API_KEY }}
          WALLHAVEN_CURATOR_DELAY: "1.45"
        run: python scripts/curate_wallhaven_characters.py --offset 0 --limit 25 --apply
      - name: Validate curated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/wallhaven_character_overrides.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          chars=data.get('characters') or {}
          print('approved_total=', len(chars))
          for cid, row in list(chars.items())[:25]:
              assert str(row.get('url','')).startswith('https://w.wallhaven.cc/full/')
              assert int(row.get('width') or 0) >= 1000
              assert int(row.get('height') or 0) >= 1500
              assert abs(float(row.get('ratio') or 0) - (2/3)) <= 0.035
              assert float(row.get('score') or 0) >= 82
              print(cid, row.get('character_name'), '/', row.get('anime'), row.get('width'), row.get('height'), row.get('score'), row.get('wallhaven_id'))
          PY
          git diff --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/wallhaven-curation-apply-01.yml
      - name: Commit curated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallhaven_character_overrides.json data/wallhaven_curation_state.json .github/workflows/wallhaven-curation-apply-01.yml
          git diff --cached --quiet && exit 0
          git commit -m "Curate first strict Wallhaven character portraits"
          git push origin HEAD:main
