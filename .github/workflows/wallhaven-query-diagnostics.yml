name: Wallhaven query diagnostics

on:
  push:
    paths:
      - ".github/workflows/wallhaven-query-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install httpx
      - name: Compare Wallhaven filters for missed popular characters
        run: |
          python - <<'PY'
          import httpx,time
          names=['Monkey D. Luffy','Roronoa Zoro','Nami','Portgas D. Ace','Boa Hancock']
          modes=[
            ('strict', {'atleast':'1000x1500','ratios':'2x3'}),
            ('2x3_any_size', {'ratios':'2x3'}),
            ('portrait_size_no_ratio', {'atleast':'1000x1500'}),
            ('broad', {}),
          ]
          base={'categories':'010','purity':'100','sorting':'relevance','order':'desc','page':'1'}
          headers={'User-Agent':'SourceBaltigo-Wallhaven-Diagnostics/1.0'}
          with httpx.Client(timeout=20,follow_redirects=True,headers=headers) as client:
            for name in names:
              print('\nCHARACTER',name)
              for label,extra in modes:
                params={**base,**extra,'q':name}
                r=client.get('https://wallhaven.cc/api/v1/search',params=params)
                print('MODE',label,'HTTP',r.status_code)
                if r.status_code==429:
                  print('RATE_LIMIT',r.headers.get('Retry-After')); raise SystemExit(0)
                r.raise_for_status()
                items=(r.json() or {}).get('data') or []
                print('COUNT',len(items))
                for x in items[:3]:
                  print(' ',x.get('id'),x.get('resolution'),x.get('ratio'),x.get('favorites'),x.get('views'))
                time.sleep(1.6)
          PY
