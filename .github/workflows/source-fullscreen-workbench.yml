name: Source fullscreen workbench
on:
  push:
    branches: [codex/source-fullscreen-safeareas-20260925]
    paths: ['.github/workflows/source-fullscreen-workbench.yml', '.source-fullscreen.patch.b64', 'aninexus_frontend/**', 'scripts/verify_fullscreen_browser.py']
permissions:
  contents: write
concurrency:
  group: source-fullscreen-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified fullscreen changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          path = Path('.source-fullscreen.patch.b64')
          if path.exists():
              patch = lzma.decompress(base64.b64decode(path.read_text().strip(), validate=True))
              assert hashlib.sha256(patch).hexdigest() == '61dbeb442f790233e7217c0c876a04f177c6f080e0946671cfca3f98c07182d8', 'Patch checksum mismatch'
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              subprocess.run(['git', 'rm', '.source-fullscreen.patch.b64'], check=True)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ruff playwright
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/source-browser-tools agent-browser
          cd aninexus_frontend && bun install --frozen-lockfile
      - name: Compile and synchronize runtime
        run: |
          cd aninexus_frontend && bun run build && cd ..
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aninexus_frontend aninexus_runtime scripts/verify_fullscreen_browser.py tests/test_fullscreen_viewport.py docs/fullscreen.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: fullscreen MiniApp with shared Telegram safe-area layout'
            git push origin HEAD:codex/source-fullscreen-safeareas-20260925
          fi
      - name: Python regression and critical lint
        run: |
          mkdir -p fullscreen-proof
          set -o pipefail
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q | tee fullscreen-proof/pytest.txt
      - name: Agent-browser fullscreen smoke
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_fullscreen_browser.py --serve >/tmp/fullscreen-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8766/menu >/dev/null && break || sleep 1; done
          /tmp/source-browser-tools/node_modules/.bin/agent-browser --executable-path "$CHROMIUM_PATH" open 'http://127.0.0.1:8766/menu#settings'
          /tmp/source-browser-tools/node_modules/.bin/agent-browser wait --load networkidle
          /tmp/source-browser-tools/node_modules/.bin/agent-browser snapshot -i >fullscreen-proof/agent-snapshot.txt
          /tmp/source-browser-tools/node_modules/.bin/agent-browser screenshot fullscreen-proof/agent-settings.png
          /tmp/source-browser-tools/node_modules/.bin/agent-browser errors >fullscreen-proof/agent-errors.txt
          /tmp/source-browser-tools/node_modules/.bin/agent-browser close
      - name: Fullscreen, overlays, keyboard and fallback browser checks
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_fullscreen_browser.py --output fullscreen-proof/fullscreen
      - name: Existing responsive and favorite flows
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output fullscreen-proof/regression
      - name: Record source and review evidence
        if: always()
        run: |
          mkdir -p fullscreen-proof
          git rev-parse HEAD >fullscreen-proof/source-sha.txt
          cp /tmp/fullscreen-server.log fullscreen-proof/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-fullscreen-proof
          path: fullscreen-proof/
          retention-days: 7
