name: Inspect database core

on:
  push:
    branches:
      - v2/p1-database-core

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-database-core
          fetch-depth: 0

      - name: Inspect PostgreSQL core symbols
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('database.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text, filename=str(path))

          symbols = {'dict_row', 'ConnectionPool', 'DATABASE_URL', 'pool', '_run'}
          uses = {name: [] for name in symbols}

          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id in symbols:
                  uses[node.id].append((node.lineno, type(node.ctx).__name__))

          for name in sorted(symbols):
              print(f'=== {name}: {uses[name]} ===')

          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  if node.name == '_run':
                      print(f'=== _run definition {node.lineno}-{node.end_lineno} ===')
                      for i in range(node.lineno, (node.end_lineno or node.lineno) + 1):
                          print(f'{i:05d}: {lines[i-1]}')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-database-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária do database core [db-core-inspection-done]"
          git push origin HEAD:v2/p1-database-core
