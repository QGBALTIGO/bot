name: Native WebApps regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["aninexus_frontend/**", "aninexus_runtime/**", "webapp_routes/native_webapps.py", "webapp_entrypoint.py", "bot.py", "tests/test_native*.py", "tests/test_single_miniapp.py", "utils/miniapp*.py", "commands/**", "scripts/verify_single_miniapp_browser.py", "tests/test_fullscreen_viewport.py", "scripts/verify_native_browser.py", "scripts/verify_fullscreen_browser.py", "scripts/verify_profile_identity_browser.py", ".github/workflows/native-webapps.yml"]
  push:
    branches: [main]
    paths: ["aninexus_frontend/**", "aninexus_runtime/**", "webapp_routes/native_webapps.py", "webapp_entrypoint.py", "bot.py", "tests/test_native*.py", "tests/test_single_miniapp.py", "utils/miniapp*.py", "commands/**", "scripts/verify_single_miniapp_browser.py", "tests/test_fullscreen_viewport.py", "scripts/verify_native_browser.py", "scripts/verify_fullscreen_browser.py", "scripts/verify_profile_identity_browser.py", ".github/workflows/native-webapps.yml"]
permissions:
  contents: read
concurrency:
  group: native-webapps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          cd aninexus_frontend && bun install --frozen-lockfile && cd ..
          pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Build native runtime
        run: cd aninexus_frontend && bun run build
      - name: Verify committed runtime
        run: diff -qr aninexus_frontend/dist aninexus_runtime
      - name: Verify routes and transactions
        run: python -m pytest -q tests/test_native_webapps.py tests/test_native_nickname_transactions.py tests/test_webapp_identity.py tests/test_fullscreen_viewport.py tests/test_single_miniapp.py
      - name: Verify real UI with synthetic API fixtures
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output native-proof
      - name: Verify fullscreen, safe controls and keyboard
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_fullscreen_browser.py --output native-proof/fullscreen
      - name: Verify the integrated profile and favorite settings
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_profile_identity_browser.py --output native-proof/profile-identity
      - name: Verify one entrypoint and stale-session notification
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_single_miniapp_browser.py --output native-proof/single-miniapp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webapps-dist
          path: aninexus_frontend/dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webapps-browser-proof
          path: native-proof/
          retention-days: 7
