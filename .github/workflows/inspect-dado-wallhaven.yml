name: Inspect Dado Wallhaven hook

on:
  push:
    paths:
      - ".github/workflows/inspect-dado-wallhaven.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show dynamic resolver hook
        run: |
          grep -n -C 24 "character_image_resolver\|resolve_character_portrait" webapp.py || true
