name: Inspect collection domain

on:
  push:
    branches:
      - v2/p1-collection-domain
    paths:
      - .github/workflows/inspect-collection-domain.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-collection-domain
          fetch-depth: 0

      - name: Map collection helper usages
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))
          symbols = {
              '_collection_character_subcategory_map',
              '_collection_snapshot',
              '_collection_profile_payload',
              '_collection_cards_from_snapshot',
              '_collection_animes_from_snapshot',
              '_collection_detail_from_snapshot',
          }

          owners = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  owners.append((node.lineno, node.end_lineno or node.lineno, node.name))

          def owner_for(lineno):
              matches = [name for start, end, name in owners if start <= lineno <= end]
              return matches[-1] if matches else '<module>'

          for symbol in sorted(symbols):
              defs = []
              loads = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == symbol:
                      defs.append((node.lineno, node.end_lineno or node.lineno))
                  if isinstance(node, ast.Name) and node.id == symbol and isinstance(node.ctx, ast.Load):
                      loads.append((node.lineno, owner_for(node.lineno)))
              print(f'{symbol}: defs={defs} loads={loads}')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-collection-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de coleção [collection-domain-inspected]"
          git push origin HEAD:v2/p1-collection-domain
