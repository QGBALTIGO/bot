name: Source profile identity verification
on:
  push:
    branches: [codex/source-profile-favorite-identity-20260925]
    paths:
      - 'aninexus_frontend/src/components/ProfileIdentity.tsx'
      - 'scripts/verify_profile_identity_browser.py'
      - '.github/workflows/source-profile-identity-verify.yml'
permissions:
  contents: write
concurrency:
  group: source-profile-identity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Replace duplicate profile blocks with the shared identity
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('aninexus_frontend/src/pages/Profile.tsx')
          source = p.read_text()
          if '<ProfileIdentity user={user} />' not in source:
              raw = p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == '00fc1d4bd635f65f035b81df5a6d4a3eaf1a5a5e', 'Profile changed; reconcile instead of overwriting'
              source = source.replace('  Crown,\n', '').replace('  Ticket,\n', '')
              source = source.replace("import { navigateNative } from '../native/navigation';\nimport { Button } from '../components/ui/Button';\n", "import { ProfileIdentity } from '../components/ProfileIdentity';\n")
              source = source.replace("  const passType = stats?.pass_type || 'free';\n  const passLabel = passType === 'free' ? 'PASSE GRÁTIS' : passType === 'premium' ? 'PASSE PREMIUM' : 'PASSE ELITE';\n", '')
              source = source.replace("  const currentTitle = user.titles?.current || 'USUÁRIO';\n", '')
              source = source.replace("  const usernameLabel = user.username ? `@${user.username}` : `ID ${user.id}`;\n", '')
              start = source.index('      {user.favorite && (')
              end = source.index('        {/* Collection Summary Card */}', start)
              replacement = '      {/* Profile & Registry Summary */}\n      <section className="grid grid-cols-1 md:grid-cols-3 gap-4">\n        <ProfileIdentity user={user} />\n\n'
              p.write_text(source[:start] + replacement + source[end:])
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: |
          cd aninexus_frontend && bun install --frozen-lockfile && cd ..
          pip install -r requirements.txt pytest pytest-asyncio ruff playwright
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/source-browser-tools agent-browser
      - name: Build and synchronize the production frontend
        run: |
          cd aninexus_frontend && bun run build && cd ..
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
      - name: Python regression and critical lint
        run: |
          mkdir -p profile-identity-proof
          set -o pipefail
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q | tee profile-identity-proof/pytest.txt
      - name: Agent-browser verification of the real profile
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --serve >/tmp/profile-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/menu >/dev/null && break || sleep 1; done
          AB=/tmp/source-browser-tools/node_modules/.bin/agent-browser
          $AB --executable-path "$CHROMIUM_PATH" open http://127.0.0.1:8765/menu#profile
          $AB wait --load networkidle
          $AB snapshot -i >profile-identity-proof/agent-snapshot.txt
          $AB screenshot profile-identity-proof/agent-profile.png
          $AB close
      - name: Test favorite identity, fallback, mobile layout and settings synchronization
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_profile_identity_browser.py --output profile-identity-proof
      - name: Commit only verified profile source and generated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aninexus_frontend/src/pages/Profile.tsx aninexus_runtime
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use favorite character as the integrated profile identity'
            git push origin HEAD:codex/source-profile-favorite-identity-20260925
          fi
          git rev-parse HEAD >profile-identity-proof/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-profile-identity-proof
          path: profile-identity-proof/
          retention-days: 7
