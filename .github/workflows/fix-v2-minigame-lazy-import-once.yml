name: Fix v2 minigame lazy import once

on:
  push:
    branches:
      - v2/seal-fusion
    paths:
      - .github/workflows/fix-v2-minigame-lazy-import-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/seal-fusion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make catalog import lazy and run pure tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('source_v2_minigames.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import math\n', '')
          text = text.replace('from cards_service import build_cards_final_data\n', '')
          marker = 'def _character_pool() -> list[dict[str, Any]]:\n    chars = build_cards_final_data().get("characters_by_id") or {}\n'
          replacement = 'def _character_pool() -> list[dict[str, Any]]:\n    from cards_service import build_cards_final_data\n\n    chars = build_cards_final_data().get("characters_by_id") or {}\n'
          if marker not in text:
              raise SystemExit('character pool marker not found')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          python -m pip install -q pytest psycopg[binary]
          PYTHONPATH=. python -m pytest -q tests/test_source_v2_minigames.py tests/test_source_v2_minigame_security.py
          python -m compileall -q source_v2_minigames.py

      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-v2-minigame-lazy-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+QGBALTIGO@users.noreply.github.com"
          git add -A
          git commit -m "fix: tornar catálogo dos Nexus Games lazy"
          git push origin HEAD:v2/seal-fusion
