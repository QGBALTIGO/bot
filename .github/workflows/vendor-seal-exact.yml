name: Vendor Seal frontend exact

on:
  push:
    branches:
      - v2/seal-exact-frontend
    paths:
      - .github/workflows/vendor-seal-exact.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Baltigo branch
        uses: actions/checkout@v4
        with:
          ref: v2/seal-exact-frontend
          fetch-depth: 0

      - name: Clone pinned Seal Your Waifu upstream
        run: |
          git clone https://github.com/bisug/seal-your-waifu-bot.git /tmp/seal-upstream
          git -C /tmp/seal-upstream checkout d9caac8e146d4b8c2d389e2ae220699b9a819a0d

      - name: Copy frontend byte-for-byte
        run: |
          rm -rf seal_frontend
          mkdir -p seal_frontend
          cp -a /tmp/seal-upstream/frontend/. seal_frontend/
          cp /tmp/seal-upstream/LICENSE seal_frontend/LICENSE

      - name: Verify frontend is identical to upstream
        run: |
          diff -qr /tmp/seal-upstream/frontend seal_frontend --exclude=LICENSE
          cmp /tmp/seal-upstream/LICENSE seal_frontend/LICENSE

      - name: Commit exact upstream copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seal_frontend
          if git diff --cached --quiet; then
            echo "Seal frontend already vendored exactly."
            exit 0
          fi
          git commit -m "vendor: frontend exato do Seal Your Waifu"
          git push origin HEAD:v2/seal-exact-frontend
