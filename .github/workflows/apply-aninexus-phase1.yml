name: Apply AniNexus WebApp phase 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-aninexus-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-aninexus-webapp-phase-1
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify and apply reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aninexus-phase1/part-*.b64 | tr -d '\r\n' > /tmp/aninexus-phase1.b64
          echo '97f5e218f61bd5e8ceb442caa75eb1528ed426fcd67a81d362bb91fd0b7eedbb  /tmp/aninexus-phase1.b64' | sha256sum --check --strict
          base64 --decode /tmp/aninexus-phase1.b64 > /tmp/aninexus-phase1.patch.gz
          echo '8e5d791b4320e4a6715700eb56540b90e42c258981406f692300bdc27c7b137e  /tmp/aninexus-phase1.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/aninexus-phase1.patch.gz > /tmp/aninexus-phase1.patch
          echo '6db4e81a28a9629fb4f152861144f15338fcd667c7f9ede36c453ae0e87f2d18  /tmp/aninexus-phase1.patch' | sha256sum --check --strict
          git apply --check /tmp/aninexus-phase1.patch
          git apply --index /tmp/aninexus-phase1.patch
          rm -rf .github/aninexus-phase1
          rm -f .github/workflows/apply-aninexus-phase1.yml
          git add -A
          git diff --cached --check

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
          pip check

      - name: Validate Python and tests
        run: |
          python -m compileall -q .
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git commit -m 'feat: rebuild WebApps around AniNexus'
          git push origin HEAD:main
