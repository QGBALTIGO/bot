name: Catalog cleanup audit

on:
  push:
    branches:
      - catalog-cleanup-v1
    paths:
      - 'scripts/audit_character_catalog.py'
      - 'scripts/refine_catalog_cleanup_audit.py'
      - 'scripts/resolve_catalog_reviews.py'
      - 'scripts/resolve_catalog_reviews_final.py'
      - 'scripts/audit_franchise_gaps.py'
      - 'scripts/ensure_franchise_must_haves.py'
      - 'scripts/normalize_must_have_targets.py'
      - 'scripts/build_catalog_cleanup_overrides.py'
      - 'scripts/consolidate_catalog_franchises.py'
      - 'scripts/build_catalog_impact_manifest.py'
      - 'scripts/finalize_catalog_cleanup_plan.py'
      - 'scripts/materialize_final_catalog_overrides.py'
      - 'scripts/apply_catalog_retirements.py'
      - 'utils/dado_catalog_runtime.py'
      - 'commands/dado.py'
      - 'webapp_entrypoint.py'
      - 'tests/test_catalog_cleanup.py'
      - 'tests/test_franchise_must_haves.py'
      - 'tests/test_normalize_must_have_targets.py'
      - 'tests/test_consolidate_catalog_franchises.py'
      - 'tests/test_catalog_identity_display.py'
      - 'tests/test_catalog_review_resolution.py'
      - 'tests/test_catalog_review_resolution_final.py'
      - 'tests/test_build_catalog_impact_manifest.py'
      - 'tests/test_finalize_catalog_cleanup_plan.py'
      - 'tests/test_materialize_final_catalog_overrides.py'
      - 'tests/test_catalog_apply_safety.py'
      - 'tests/test_dado_catalog_runtime.py'
      - '.github/workflows/catalog-cleanup-audit.yml'
      - 'data/personagens_anilist.txt'
      - 'data/cards_overrides.json'
  workflow_dispatch:

concurrency:
  group: catalog-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check httpx 'psycopg[binary]' pytest
      - name: Catalog cleanup unit tests
        run: >-
          pytest -q
          tests/test_catalog_cleanup.py
          tests/test_franchise_must_haves.py
          tests/test_normalize_must_have_targets.py
          tests/test_consolidate_catalog_franchises.py
          tests/test_catalog_identity_display.py
          tests/test_catalog_review_resolution.py
          tests/test_catalog_review_resolution_final.py
          tests/test_build_catalog_impact_manifest.py
          tests/test_finalize_catalog_cleanup_plan.py
          tests/test_materialize_final_catalog_overrides.py
          tests/test_catalog_apply_safety.py
          tests/test_dado_catalog_runtime.py

  # A varredura externa continua manual por padrão. O marcador de commit abaixo
  # serve somente para refreshes deliberados do snapshot da branch de limpeza.
  full-audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-catalog-audit]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check httpx
      - name: Audit all current anime and characters
        env:
          CATALOG_AUDIT_REQUEST_DELAY: '2.20'
        run: |
          python scripts/audit_character_catalog.py \
            --request-delay 2.20 \
            --output /tmp/catalog_cleanup_audit_raw.json
      - name: Refine retirement decisions
        run: |
          python scripts/refine_catalog_cleanup_audit.py \
            --input /tmp/catalog_cleanup_audit_raw.json \
            --output /tmp/catalog_cleanup_audit_refined.json
      - name: Resolve clear REVIEW cases conservatively
        run: |
          python scripts/resolve_catalog_reviews.py \
            --input /tmp/catalog_cleanup_audit_refined.json \
            --output /tmp/catalog_cleanup_audit_second.json
      - name: Resolve final REVIEW cases with recurring protection
        run: |
          python scripts/resolve_catalog_reviews_final.py \
            --input /tmp/catalog_cleanup_audit_second.json \
            --output /tmp/catalog_cleanup_audit.json
      - name: Build compact read-only impact manifest
        run: |
          python scripts/build_catalog_impact_manifest.py \
            --audit /tmp/catalog_cleanup_audit.json \
            --output /tmp/catalog_cleanup_retire_candidates.v1.json \
            --snapshot "$(date -u +%F)"
      - name: Audit franchises and missing sequel characters
        run: |
          python scripts/audit_franchise_gaps.py \
            --output /tmp/catalog_franchise_gaps.raw.json
      - name: Ensure must-have franchise characters
        run: |
          python scripts/ensure_franchise_must_haves.py \
            --input /tmp/catalog_franchise_gaps.raw.json \
            --output /tmp/catalog_franchise_gaps.must_haves.json
      - name: Normalize canonical franchise targets
        run: |
          python scripts/normalize_must_have_targets.py \
            --input /tmp/catalog_franchise_gaps.must_haves.json \
            --output /tmp/catalog_franchise_gaps.json
      - name: Build non-production catalog proposal
        run: |
          python scripts/build_catalog_cleanup_overrides.py \
            --audit /tmp/catalog_cleanup_audit.json \
            --franchise /tmp/catalog_franchise_gaps.json \
            --output /tmp/cards_overrides.cleanup_raw.json
      - name: Consolidate duplicate and empty categories
        run: |
          python scripts/consolidate_catalog_franchises.py \
            --proposal /tmp/cards_overrides.cleanup_raw.json \
            --audit /tmp/catalog_cleanup_audit.json \
            --franchise /tmp/catalog_franchise_gaps.json \
            --output /tmp/cards_overrides.cleanup_proposal.json
      - name: Print cleanup focus
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/catalog_cleanup_audit.json', encoding='utf-8'))
          f=json.load(open('/tmp/catalog_franchise_gaps.json', encoding='utf-8'))
          o=json.load(open('/tmp/cards_overrides.cleanup_proposal.json', encoding='utf-8'))
          m=json.load(open('/tmp/catalog_cleanup_retire_candidates.v1.json', encoding='utf-8'))
          print('GLOBAL_FINAL', json.dumps(p.get('summary') or {}, ensure_ascii=False, sort_keys=True))
          print('SECOND_PASS', json.dumps(p.get('review_resolution') or {}, ensure_ascii=False, sort_keys=True))
          print('THIRD_PASS', json.dumps(p.get('final_review_resolution') or {}, ensure_ascii=False, sort_keys=True))
          print('MANIFEST', json.dumps({'count':m.get('candidate_count'),'sha256':m.get('candidate_ids_sha256')}, sort_keys=True))
          reports=p.get('anime_reports') or {}
          for aid in ('21','269','6702','527','113415'):
              row=reports.get(aid) or {}
              print('FOCUS', aid, row.get('anime'), 'current=', row.get('current_count'), 'counts=', json.dumps(row.get('counts') or {}, ensure_ascii=False, sort_keys=True), 'recommended=', row.get('recommended_total_after_final_review', row.get('recommended_total_after_review_resolution')))
          print('FRANCHISE_GLOBAL', json.dumps(f.get('summary') or {}, ensure_ascii=False, sort_keys=True))
          print('CANONICAL_TARGETS', json.dumps(f.get('canonical_target_normalization') or {}, ensure_ascii=False, sort_keys=True))
          print('PROPOSAL_COUNTS', 'deleted_chars=', len(o.get('deleted_characters') or []), 'deleted_animes=', len(o.get('deleted_animes') or []), 'custom_animes=', len(o.get('custom_animes') or []), 'custom_characters=', len(o.get('custom_characters') or []))
          print('NEW_ANIMES', [x.get('anime') for x in (o.get('custom_animes') or []) if x.get('_catalog_source') in {'franchise_cleanup_v1','must_have_franchise_v1'}])
          print('NARUTO_MUST_HAVES', json.dumps(f.get('must_have_insertions') or [], ensure_ascii=False))
          print('IDENTITY_ALIASES', json.dumps(f.get('identity_aliases') or {}, ensure_ascii=False, sort_keys=True))
          print('IDENTITY_DISPLAY', json.dumps(f.get('identity_display_overrides') or {}, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-cleanup-audit
          path: |
            /tmp/catalog_cleanup_audit.json
            /tmp/catalog_cleanup_retire_candidates.v1.json
            /tmp/catalog_franchise_gaps.json
            /tmp/cards_overrides.cleanup_proposal.json
          retention-days: 14
