name: Catalog cleanup audit

on:
  push:
    branches:
      - catalog-cleanup-v1
    paths:
      - 'scripts/audit_character_catalog.py'
      - 'scripts/refine_catalog_cleanup_audit.py'
      - 'scripts/resolve_catalog_reviews.py'
      - 'scripts/audit_franchise_gaps.py'
      - 'scripts/ensure_franchise_must_haves.py'
      - 'scripts/build_catalog_cleanup_overrides.py'
      - 'scripts/finalize_catalog_cleanup_plan.py'
      - 'scripts/apply_catalog_retirements.py'
      - 'tests/test_catalog_cleanup.py'
      - 'tests/test_franchise_must_haves.py'
      - 'tests/test_catalog_identity_display.py'
      - 'tests/test_catalog_review_resolution.py'
      - 'tests/test_finalize_catalog_cleanup_plan.py'
      - 'tests/test_catalog_apply_safety.py'
      - '.github/workflows/catalog-cleanup-audit.yml'
      - 'data/personagens_anilist.txt'
      - 'data/cards_overrides.json'
  workflow_dispatch:

concurrency:
  group: catalog-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check httpx 'psycopg[binary]' pytest
      - name: Catalog cleanup unit tests
        run: >-
          pytest -q
          tests/test_catalog_cleanup.py
          tests/test_franchise_must_haves.py
          tests/test_catalog_identity_display.py
          tests/test_catalog_review_resolution.py
          tests/test_finalize_catalog_cleanup_plan.py
          tests/test_catalog_apply_safety.py

  # Full external audit is intentionally manual. Re-running it on every commit
  # wastes AniList quota and can make two catalog snapshots compete.
  full-audit:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check httpx
      - name: Audit all current anime and characters
        env:
          CATALOG_AUDIT_REQUEST_DELAY: '2.20'
        run: |
          python scripts/audit_character_catalog.py \
            --request-delay 2.20 \
            --output /tmp/catalog_cleanup_audit_raw.json
      - name: Refine retirement decisions
        run: |
          python scripts/refine_catalog_cleanup_audit.py \
            --input /tmp/catalog_cleanup_audit_raw.json \
            --output /tmp/catalog_cleanup_audit_refined.json
      - name: Resolve clear REVIEW cases conservatively
        run: |
          python scripts/resolve_catalog_reviews.py \
            --input /tmp/catalog_cleanup_audit_refined.json \
            --output /tmp/catalog_cleanup_audit.json
      - name: Audit franchises and missing sequel characters
        run: |
          python scripts/audit_franchise_gaps.py \
            --output /tmp/catalog_franchise_gaps.raw.json
      - name: Ensure must-have franchise characters
        run: |
          python scripts/ensure_franchise_must_haves.py \
            --input /tmp/catalog_franchise_gaps.raw.json \
            --output /tmp/catalog_franchise_gaps.json
      - name: Build non-production catalog proposal
        run: |
          python scripts/build_catalog_cleanup_overrides.py \
            --audit /tmp/catalog_cleanup_audit.json \
            --franchise /tmp/catalog_franchise_gaps.json \
            --output /tmp/cards_overrides.cleanup_proposal.json
      - name: Print cleanup focus
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/catalog_cleanup_audit.json', encoding='utf-8'))
          f=json.load(open('/tmp/catalog_franchise_gaps.json', encoding='utf-8'))
          o=json.load(open('/tmp/cards_overrides.cleanup_proposal.json', encoding='utf-8'))
          print('GLOBAL_RESOLVED', json.dumps(p.get('summary') or {}, ensure_ascii=False, sort_keys=True))
          print('REVIEW_RESOLUTION', json.dumps(p.get('review_resolution') or {}, ensure_ascii=False, sort_keys=True))
          reports=p.get('anime_reports') or {}
          for aid in ('21','269','6702','527','113415'):
              row=reports.get(aid) or {}
              print('FOCUS', aid, row.get('anime'), 'current=', row.get('current_count'), 'counts=', json.dumps(row.get('counts') or {}, ensure_ascii=False, sort_keys=True), 'recommended=', row.get('recommended_total_after_review_resolution', row.get('recommended_total_after_review')))
          print('FRANCHISE_GLOBAL', json.dumps(f.get('summary') or {}, ensure_ascii=False, sort_keys=True))
          print('PROPOSAL_COUNTS', 'deleted=', len(o.get('deleted_characters') or []), 'custom_animes=', len(o.get('custom_animes') or []), 'custom_characters=', len(o.get('custom_characters') or []))
          print('NARUTO_MUST_HAVES', json.dumps(f.get('must_have_insertions') or [], ensure_ascii=False))
          print('IDENTITY_ALIASES', json.dumps(f.get('identity_aliases') or {}, ensure_ascii=False, sort_keys=True))
          print('IDENTITY_DISPLAY', json.dumps(f.get('identity_display_overrides') or {}, ensure_ascii=False, sort_keys=True))
          print('MISSING_FRANCHISES')
          for row in (f.get('missing_franchises') or [])[:40]:
              media=row.get('missing_popular_media') or []
              best=media[0] if media else {}
              print(row.get('target_anime_id'), row.get('target_anime'), 'rank=', best.get('popularity_rank'), 'pop=', best.get('popularity'))
          print('TOP_CHARACTER_ADDS')
          for row in (f.get('character_add_candidates') or [])[:80]:
              print(row.get('id'), row.get('name'), '/', row.get('target_anime'), 'role=', row.get('role'), 'fav=', row.get('favourites'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-cleanup-audit
          path: |
            /tmp/catalog_cleanup_audit.json
            /tmp/catalog_franchise_gaps.json
            /tmp/cards_overrides.cleanup_proposal.json
          retention-days: 14
