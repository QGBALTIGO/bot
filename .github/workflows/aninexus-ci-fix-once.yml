name: AniNexus CI fix once

on:
  push:
    branches:
      - v2/aninexus-platform

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/aninexus-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply cleanup
        run: python scripts/fix_aninexus_ci.py

      - name: Compile Python
        run: python -m compileall -q .

      - name: Remove one-time files
        run: |
          rm -f scripts/fix_aninexus_ci.py
          rm -f .github/workflows/aninexus-ci-fix-once.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remover fallbacks duplicados da MiniApp AniNexus'
          git push origin HEAD:v2/aninexus-platform
