name: Diagnose deployed home source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-home-source-diagnostic.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe known Railway public hosts
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          hosts=[
            'https://bot-production-1980.up.railway.app',
            'https://qgbaltigo-bot-production.up.railway.app',
          ]
          paths=['/','/programacao','/programação','/api/programacao','/api/schedule','/api/airing']
          needles=['O mesmo card','Próximos Episódios','TEMPORADA ATUAL','Explore o ecossistema','Anime, manga e cards']
          for host in hosts:
            print('\nHOST',host)
            for path in paths:
              url=host+path
              req=urllib.request.Request(url,headers={'User-Agent':'Baltigo-Live-Diagnostic/1.0'})
              try:
                with urllib.request.urlopen(req,timeout=12) as r:
                  body=r.read(200000).decode('utf-8','replace')
                  print('PATH',path,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'LEN',len(body))
                  if path=='/':
                    for n in needles:
                      print(' NEEDLE',repr(n),n.casefold() in body.casefold())
                    print(' HEAD',body[:800].replace('\n',' '))
                  elif body:
                    print(' SAMPLE',body[:500].replace('\n',' '))
              except urllib.error.HTTPError as e:
                b=e.read(1000).decode('utf-8','replace')
                print('PATH',path,'HTTP',e.code,'BODY',b[:300].replace('\n',' '))
              except Exception as e:
                print('PATH',path,'ERROR',type(e).__name__,str(e))
          PY
      - name: Compare repository home signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['premium_webapp_ui.py','webapp.py']:
            t=Path(f).read_text(encoding='utf-8')
            print(f,'same-card=', 'O mesmo card'.casefold() in t.casefold(),'temporada=', 'TEMPORADA ATUAL'.casefold() in t.casefold(),'explore=', 'Explore o ecossistema'.casefold() in t.casefold())
          PY
      - name: Remove workflow
        run: |
          rm -f .github/workflows/live-home-source-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/live-home-source-diagnostic.yml
          git commit -m 'Remove deployed home diagnostic workflow'
          git push origin HEAD:main
