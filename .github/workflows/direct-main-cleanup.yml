name: Direct main cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-main-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip check

      - name: Apply reliability and endpoint hardening
        run: python scripts/apply_direct_security_hardening.py

      - name: Remove temporary applicator files
        run: |
          rm -f scripts/apply_direct_security_hardening.py
          rm -f .github/workflows/direct-main-cleanup.yml

      - name: Validate source
        run: |
          python -m compileall -q .
          python -m py_compile bot.py database.py webapp.py premium_webapp_ui.py utils/runtime_guard.py
          git diff --check

      - name: Run tests
        run: python -m pytest -q

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py database.py webapp.py premium_webapp_ui.py utils/runtime_guard.py
          git add -u scripts/apply_direct_security_hardening.py .github/workflows/direct-main-cleanup.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: harden WebApp endpoints and dado reliability"
          git push origin HEAD:main
