name: Direct main cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-main-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove unreachable legacy implementations
        run: python scripts/apply_direct_security_hardening.py

      - name: Validate source
        run: |
          python -m compileall -q .
          python -m py_compile webapp.py
          git diff --check

      - name: Run tests
        run: python -m pytest -q

      - name: Commit directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp.py
          git commit -m "refactor: remove unreachable legacy WebApp code"
          git push origin HEAD:main
