name: Direct main admin hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-main-admin-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Harden administrative error handling
        run: python scripts/apply_admin_error_hardening.py

      - name: Validate source and tests
        run: |
          python -m compileall -q .
          ruff check . --select E9,F63,F7,F82 --exclude data
          pytest -q
          git diff --check

      - name: Remove one-time maintenance files
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/direct-main-cleanup.yml \
            scripts/apply_admin_error_hardening.py \
            scripts/apply_direct_security_hardening.py \
            scripts/remove_unreachable_legacy.py \
            scripts/apply_main_hardening.py

      - name: Commit directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: stop leaking administrative exceptions"
          git push origin HEAD:main
