name: Inspect catalog domain

on:
  push:
    branches:
      - v2/p1-catalog-domain
    paths:
      - .github/workflows/inspect-catalog-domain.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-catalog-domain
          fetch-depth: 0

      - name: Map anime and manga catalog coupling
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text, filename=str(path))

          print('=== CATALOG-RELATED TOP LEVEL FUNCTIONS ===')
          related = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              routes = []
              for dec in node.decorator_list:
                  if (
                      isinstance(dec, ast.Call)
                      and isinstance(dec.func, ast.Attribute)
                      and dec.args
                      and isinstance(dec.args[0], ast.Constant)
                      and isinstance(dec.args[0].value, str)
                  ):
                      routes.append((dec.func.attr.upper(), dec.args[0].value))
              name_key = node.name.lower()
              route_key = ' '.join(path for _, path in routes).lower()
              if any(key in name_key or key in route_key for key in ('catalog', 'manga', 'letters')):
                  related.append(node)
                  print(f'{node.name}: {node.lineno}-{node.end_lineno}; routes={routes}')

          print('=== CATALOG-RELATED ASSIGNMENTS ===')
          assignment_symbols = set()
          for node in tree.body:
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              targets = node.targets if isinstance(node, ast.Assign) else [node.target]
              for target in targets:
                  if not isinstance(target, ast.Name):
                      continue
                  name = target.id
                  if 'CATALOG' in name or name.startswith('_MANGA_') or name in {
                      '_CATALOG', '_LETTER_COUNTS', '_TOTAL',
                  }:
                      assignment_symbols.add(name)
                      print(f'{name}: {node.lineno}-{node.end_lineno}')

          owners = [
              (node.lineno, node.end_lineno or node.lineno, node.name)
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          def owner_for(line):
              for start, end, name in owners:
                  if start <= line <= end:
                      return name
              return '<module>'

          print('=== SHARED HELPERS ===')
          shared = {
              '_normalize_title', '_first_letter', '_safe_int', '_unwrap_records',
              '_coerce_item', '_load_catalog', '_filter_catalog',
              '_detect_manga_badge', '_coerce_manga_item', '_load_manga_catalog', '_filter_manga_catalog',
          }
          for symbol in sorted(shared):
              defs = []
              loads = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == symbol:
                      defs.append((node.lineno, node.end_lineno or node.lineno))
                  if isinstance(node, ast.Name) and node.id == symbol and isinstance(node.ctx, ast.Load):
                      loads.append((node.lineno, owner_for(node.lineno)))
              print(f'{symbol}: defs={defs} loads={loads}')

          print('=== BUILDER USES ===')
          for symbol in ('build_media_catalog_page_html',):
              loads = [
                  (node.lineno, owner_for(node.lineno))
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name) and node.id == symbol and isinstance(node.ctx, ast.Load)
              ]
              print(f'{symbol}: {loads}')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-catalog-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de Catálogo [catalog-domain-inspected]"
          git push origin HEAD:v2/p1-catalog-domain
