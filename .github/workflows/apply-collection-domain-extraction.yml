name: Apply collection domain extraction

on:
  push:
    branches:
      - v2/p1-collection-domain
    paths:
      - .github/workflows/apply-collection-domain-extraction.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-collection-domain
          fetch-depth: 0

      - name: Install test runner
        run: python -m pip install -q pytest

      - name: Apply surgical extraction
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))

          helper_names = {
              '_collection_character_subcategory_map',
              '_collection_snapshot',
              '_collection_profile_payload',
              '_collection_cards_from_snapshot',
              '_collection_animes_from_snapshot',
              '_collection_detail_from_snapshot',
          }
          route_names = {
              'api_collection_state',
              'api_collection_cards',
              'api_collection_animes',
              'api_collection_anime',
              'collection_webapp_page',
          }
          removable_names = helper_names | route_names

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name in removable_names
          }
          missing = removable_names - functions.keys()
          if missing:
              raise SystemExit(f'Abortando: funções esperadas ausentes: {sorted(missing)}')

          owners = [
              (node.lineno, node.end_lineno or node.lineno, node.name)
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]

          def owner_for(lineno: int) -> str:
              for start, end, name in owners:
                  if start <= lineno <= end:
                      return name
              return '<module>'

          # Cada helper deve ser consumido somente por funções que também sairão.
          for symbol in helper_names:
              uses = [
                  (node.lineno, owner_for(node.lineno))
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name)
                  and node.id == symbol
                  and isinstance(node.ctx, ast.Load)
              ]
              outside = [(lineno, owner) for lineno, owner in uses if owner not in removable_names]
              if outside:
                  raise SystemExit(f'Abortando: {symbol} possui consumidores externos: {outside}')

          # O builder da página e o overview são exclusivos do bloco removido no monólito.
          exclusive_symbols = {
              'build_collection_page_html': {'collection_webapp_page'},
              'build_menu_user_payload': {'_collection_profile_payload'},
          }
          for symbol, allowed_owners in exclusive_symbols.items():
              uses = [
                  (node.lineno, owner_for(node.lineno))
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name)
                  and node.id == symbol
                  and isinstance(node.ctx, ast.Load)
              ]
              outside = [(lineno, owner) for lineno, owner in uses if owner not in allowed_owners]
              if outside:
                  raise SystemExit(f'Abortando: {symbol} possui consumidores externos: {outside}')

          ranges = []
          for name, node in functions.items():
              start = min([d.lineno for d in node.decorator_list] + [node.lineno])
              end = node.end_lineno or node.lineno
              ranges.append((start, end, name))

          lines = text.splitlines(keepends=True)
          for start, end, _ in sorted(ranges, reverse=True):
              del lines[start - 1:end]

          new_text = ''.join(lines)

          overview_import = 'from webapp_services.profile_overview import build_menu_user_payload\n'
          if new_text.count(overview_import) != 1:
              raise SystemExit(
                  f'Abortando: import do overview não é único: {new_text.count(overview_import)}'
              )
          new_text = new_text.replace(overview_import, '', 1)

          collection_builder_import = '    build_collection_page as build_collection_page_html,\n'
          if new_text.count(collection_builder_import) != 1:
              raise SystemExit(
                  'Abortando: import do builder da coleção não é único: '
                  f'{new_text.count(collection_builder_import)}'
              )
          new_text = new_text.replace(collection_builder_import, '', 1)

          parsed = ast.parse(new_text, filename=str(path))
          remaining_defs = {
              node.name
              for node in parsed.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked_defs = removable_names & remaining_defs
          if leaked_defs:
              raise SystemExit(f'Abortando: funções legadas permaneceram: {sorted(leaked_defs)}')

          for symbol in helper_names | {'build_collection_page_html', 'build_menu_user_payload'}:
              loads = [
                  node.lineno
                  for node in ast.walk(parsed)
                  if isinstance(node, ast.Name)
                  and node.id == symbol
                  and isinstance(node.ctx, ast.Load)
              ]
              if loads:
                  raise SystemExit(f'Abortando: referência legada permaneceu para {symbol}: {loads}')

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes webapp_services utils
          python -m pytest -q \
            tests/test_collection_service.py \
            tests/test_collection_domain_architecture.py \
            tests/test_profile_overview_service.py \
            tests/test_webapp_auth_invariants.py \
            tests/test_webapp_route_modularization.py

      - name: Commit final refactor
        run: |
          rm .github/workflows/apply-collection-domain-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrair domínio de coleção [collection-domain-extracted]"
          git push origin HEAD:v2/p1-collection-domain
