name: Inspect terms domain

on:
  push:
    branches:
      - v2/p1-terms-domain
    paths:
      - .github/workflows/inspect-terms-domain.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-terms-domain
          fetch-depth: 0

      - name: Inspect terms symbol usages
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))
          symbols = {
              'TERMS_VERSION', 'REQUIRED_CHANNEL_URL', 'EMPTY_BG_DATA_URI',
              'pick_lang', 'TEXTS', 'TERMS_LONG', 'TERMS_HTML',
          }
          owners = [
              (node.lineno, node.end_lineno or node.lineno, node.name)
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          def owner_for(line):
              for start, end, name in owners:
                  if start <= line <= end:
                      return name
              return '<module>'

          for symbol in sorted(symbols):
              stores = []
              loads = []
              defs = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == symbol:
                      defs.append((node.lineno, node.end_lineno or node.lineno))
                  if isinstance(node, ast.Name) and node.id == symbol:
                      if isinstance(node.ctx, ast.Store):
                          stores.append(node.lineno)
                      elif isinstance(node.ctx, ast.Load):
                          loads.append((node.lineno, owner_for(node.lineno)))
              print(f'{symbol}: defs={defs} stores={stores} loads={loads}')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-terms-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de Termos [terms-domain-inspected]"
          git push origin HEAD:v2/p1-terms-domain
