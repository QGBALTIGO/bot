name: Verify live Wallhaven card replacements

on:
  push:
    paths:
      - '.github/workflows/wallhaven-live-catalog-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Poll live card catalog for globally replaced image
        run: |
          python - <<'PY'
          import time
          import httpx

          base='https://bot-production-1980.up.railway.app'
          urls=[
              base + '/api/cards/search?q=a&limit=1000',
              base + '/api/cards/search?q=e&limit=1000',
              base + '/api/cards/search?q=i&limit=1000',
              base + '/api/cards/search?q=Frieren&limit=50',
          ]
          headers={'User-Agent':'SourceBaltigo-Live-Wallhaven-Check/1.0'}
          with httpx.Client(timeout=20,follow_redirects=True,headers=headers) as client:
              for attempt in range(1, 21):
                  found=[]
                  for url in urls:
                      try:
                          r=client.get(url)
                          print('attempt',attempt,'status',r.status_code,'url',url)
                          if r.status_code != 200:
                              print(r.text[:300])
                              continue
                          data=r.json()
                          items=(data or {}).get('items') or []
                          for item in items:
                              image=str((item or {}).get('image') or '')
                              if 'w.wallhaven.cc/' in image:
                                  found.append((item.get('id'),item.get('name'),item.get('anime'),image))
                      except Exception as exc:
                          print('request_error',type(exc).__name__,str(exc)[:200])
                  if found:
                      print('LIVE_WALLHAVEN_REPLACEMENTS=',len(found))
                      for row in found[:10]: print(row)
                      raise SystemExit(0)
                  print('no replacement visible yet; waiting...')
                  time.sleep(30)
          raise SystemExit('No Wallhaven global replacement became visible in live catalog within 10 minutes')
          PY
