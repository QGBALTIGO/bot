name: Verify live Wallhaven card replacements

on:
  push:
    paths:
      - '.github/workflows/wallhaven-live-catalog-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Read live curator state and decode visible replacements
        run: |
          python - <<'PY'
          import httpx
          from urllib.parse import parse_qs, unquote, urlparse

          base='https://bot-production-1980.up.railway.app'
          headers={'User-Agent':'SourceBaltigo-Live-Wallhaven-Check/1.4'}

          def origin(image):
              value=str(image or '')
              if value.startswith('/api/image-proxy?'):
                  query=parse_qs(urlparse(value).query)
                  value=(query.get('url') or [''])[0]
              return unquote(value)

          visible=[]
          with httpx.Client(timeout=20,follow_redirects=True,headers=headers) as client:
              status=client.get(base + '/api/system/wallhaven-curator-status')
              print('STATUS_HTTP',status.status_code)
              print('STATUS_BODY',status.text[:5000])
              if status.status_code != 200:
                  raise SystemExit('status endpoint not healthy')
              payload=status.json()
              expected=int(payload.get('wallhaven_urls') or 0)
              if expected <= 0:
                  raise SystemExit('curator has not applied any Wallhaven URL')

              for q in ('a','e','i','o','u','Frieren'):
                  r=client.get(base + '/api/cards/search',params={'q':q,'limit':500})
                  print('CATALOG_HTTP',q,r.status_code)
                  if r.status_code != 200:
                      print(r.text[:500])
                      continue
                  items=(r.json() or {}).get('items') or []
                  found=[]
                  for item in items:
                      raw=origin(item.get('image'))
                      if 'w.wallhaven.cc/' in raw:
                          found.append((item.get('id'),item.get('name'),item.get('anime'),raw))
                  print('WALLHAVEN_VISIBLE',q,len(found))
                  for row in found[:10]: print(row)
                  visible.extend(found)

          unique={str(row[0]): row for row in visible}
          print('LIVE_UNIQUE_WALLHAVEN_REPLACEMENTS',len(unique),'DB_APPLIED',expected)
          if not unique:
              raise SystemExit('DB has Wallhaven URLs, but none are visible after decoding the image proxy')
          PY
