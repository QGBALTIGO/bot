name: One-shot system cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/system-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply system-only runtime cleanup
        run: python tools/system_cleanup_once.py

      - name: Remove sensitive and temporary files
        shell: bash
        run: |
          git rm --ignore-unmatch \
            sessao_busca.session \
            utils/terms_membership.py \
            .github/workflows/system-fix-batch.yml \
            .github/workflows/terms-bridge-apply.yml \
            .github/workflows/terms-direct-fix.yml \
            .github/workflows/terms-live.yml \
            .github/workflows/system-cleanup-once.yml \
            tools/system_cleanup_once.py

      - name: Validate cleanup
        shell: bash
        run: |
          python -m compileall -q .
          ! grep -R "terms_membership" -n --include='*.py' .
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py utils/channel_verification_bridge.py .gitignore
          git commit -m "Harden runtime cleanup and repository hygiene"
          git push origin HEAD:main
