name: Live exact 2x3 portrait crop check

on:
  push:
    paths:
      - '.github/workflows/live-portrait-crop-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx pillow
      - name: Wait for deploy and verify exact 2x3 output
        run: |
          python - <<'PY'
          import io,time
          import httpx
          from PIL import Image
          from urllib.parse import quote

          base='https://bot-production-1980.up.railway.app'
          source='https://w.wallhaven.cc/full/2e/wallhaven-2ep9mg.jpg'
          url=base + '/api/image-proxy?crop=portrait&url=' + quote(source, safe='')
          headers={'User-Agent':'SourceBaltigo-Live-Portrait-Crop/1.0'}
          last=None
          with httpx.Client(timeout=30,follow_redirects=True,headers=headers) as client:
            for attempt in range(18):
              r=client.get(url)
              last=r
              print('ATTEMPT',attempt+1,'HTTP',r.status_code,'TYPE',r.headers.get('content-type'),'CROP',r.headers.get('x-image-crop'),'BYTES',len(r.content))
              if r.status_code==200 and r.headers.get('x-image-crop')=='2:3':
                with Image.open(io.BytesIO(r.content)) as im:
                  w,h=im.size
                  print('LIVE_DIMENSIONS',w,h,'RATIO',w/h)
                  assert w*3==h*2, (w,h)
                  assert r.headers.get('content-type','').startswith('image/jpeg')
                  break
              time.sleep(10)
            else:
              raise SystemExit('live portrait crop never became healthy: '+repr(last.text[:500] if last is not None else None))
          PY
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/live-portrait-crop-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove live portrait crop check'
          git push origin HEAD:main
