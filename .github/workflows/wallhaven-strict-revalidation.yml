name: Strictly revalidate Wallhaven portraits

on:
  push:
    paths:
      - '.github/workflows/wallhaven-strict-revalidation.yml'

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Apply strict character-tag identity matching
        run: python scripts/apply_strict_wallhaven_tag_matching.py
      - name: Validate tag matching semantics
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import curate_wallhaven_characters as c

          fern={'name':'Fern (Sousou No Frieren)','alias':'','category':'Characters'}
          frieren={'name':'Frieren','alias':'','category':'Characters'}
          nami={'name':'Nami (One Piece)','alias':'Cat Burglar Nami','category':'Characters'}
          print('FERN_AS_FRIEREN', c.character_tag_best_match('Frieren', fern))
          print('FRIEREN_AS_FRIEREN', c.character_tag_best_match('Frieren', frieren))
          print('NAMI_AS_NAMI', c.character_tag_best_match('Nami', nami))
          assert c.character_tag_best_match('Frieren', fern) < 0.76
          assert c.character_tag_best_match('Frieren', frieren) >= 0.99
          assert c.character_tag_best_match('Nami', nami) >= 0.99
          PY
          python -m compileall -q scripts/curate_wallhaven_characters.py scripts/revalidate_wallhaven_overrides.py
          git diff --check
      - name: Revalidate every stored wallpaper against live Wallhaven metadata
        env:
          WALLHAVEN_API_KEY: ${{ secrets.WALLHAVEN_API_KEY }}
          WALLHAVEN_CURATOR_DELAY: '1.45'
        run: python scripts/revalidate_wallhaven_overrides.py --apply
      - name: Validate cleaned override file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/wallhaven_character_overrides.json').read_text(encoding='utf-8'))
          chars=d.get('characters') or {}
          print('CLEAN_CURATED_TOTAL',len(chars))
          assert chars
          for cid,row in chars.items():
              assert not (row.get('other_characters') or []), (cid,row.get('other_characters'))
              assert row.get('revalidated_at'), cid
              assert row.get('wallhaven_id'), cid
          PY
          git diff --check
      - name: Remove one-shot patch files
        run: |
          rm -f scripts/apply_strict_wallhaven_tag_matching.py
          rm -f .github/workflows/wallhaven-strict-revalidation.yml
      - name: Commit strict revalidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Strictly validate solo Wallhaven character portraits'
          git push origin HEAD:main
