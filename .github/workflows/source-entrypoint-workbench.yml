name: Source single MiniApp workbench
on:
  push:
    branches: [codex/source-single-miniapp-20260925]
    paths: ['.github/workflows/source-entrypoint-workbench.yml', '.source-entrypoint-patch/**']
permissions:
  contents: write
concurrency:
  group: source-single-miniapp-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified application patch without modifying workflows
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          folder = Path('.source-entrypoint-patch')
          if folder.exists():
              encoded = ''.join(p.read_text().strip() for p in sorted(folder.glob('*.b64')))
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == 'b65a0a985d75be72a7fcd2880233db54f8ca6def4c2e7af688a9a00b39e4b46d'
              subprocess.run(['git', 'apply', '--exclude=.github/workflows/native-webapps.yml', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '--exclude=.github/workflows/native-webapps.yml', '-'], input=patch, check=True)
              subprocess.run(['git', 'rm', '-r', '.source-entrypoint-patch'], check=True)
          test = Path('scripts/verify_single_miniapp_browser.py')
          text = test.read_text()
          if 'import re\n' not in text: text = text.replace('import argparse\n', 'import argparse\nimport re\n')
          text = text.replace("name='Loja',exact=True).wait_for()", "name=re.compile(r'^loja aninexus$', re.I)).wait_for()")
          if 'fixture.BOOT = fixture.BOOT.replace' not in text:
              text = text.replace('import verify_native_browser as fixture\n', '''import verify_native_browser as fixture
          fixture.BOOT = fixture.BOOT.replace('onEvent(){},offEvent(){},', 'onEvent(name,fn){window.__miniappResume ||= {}; (window.__miniappResume[name] ||= new Set()).add(fn)},offEvent(name,fn){window.__miniappResume?.[name]?.delete(fn)},')
          ''')
          text = text.replace("window.dispatchEvent(new Event('focus'))", "window.__miniappResume.activated.forEach(fn=>fn())")
          test.write_text(text)
          notice = Path('aninexus_frontend/src/components/AppVersionNotice.tsx')
          text = notice.read_text()
          if "onEvent?.('activated', resume)" not in text:
              text = text.replace('    void check();\n    document.addEventListener', "    void check();\n    const telegram = window.Telegram?.WebApp;\n    telegram?.onEvent?.('activated', resume);\n    document.addEventListener")
              text = text.replace("      controller?.abort();\n", "      controller?.abort();\n      telegram?.offEvent?.('activated', resume);\n")
          notice.write_text(text)
          app = Path('aninexus_frontend/src/App.tsx')
          text = app.read_text()
          old = "    const handleBack = () => {\n      if (nativeDialog) window.dispatchEvent(new Event('source:back'));\n      else if (selectedChar || selectedPet || isMenuOpen) {"
          new = "    const handleBack = () => {\n      // A mounted dialog consumes Back synchronously before state effects settle.\n      const backEvent = new Event('source:back', { cancelable: true });\n      if (!window.dispatchEvent(backEvent)) return;\n      if (nativeDialog) return;\n      if (selectedChar || selectedPet || isMenuOpen) {"
          assert old in text or 'const backEvent' in text
          app.write_text(text.replace(old, new))
          ui = Path('aninexus_frontend/src/native/ui.tsx')
          text = ui.read_text()
          ui.write_text(text.replace('    const close = () => {\n      if (!busyRef.current)', '    const close = (event?: Event) => {\n      event?.preventDefault();\n      if (!busyRef.current)'))
          test = Path('scripts/verify_fullscreen_browser.py')
          text = test.read_text().replace("page.evaluate('for(const f of __backHandlers)f()');page.get_by_role('dialog').wait_for(state='hidden')", "page.evaluate('for(const f of Array.from(__backHandlers))f()');page.get_by_role('dialog').wait_for(state='hidden');assert page.evaluate('location.hash')=='#settings';page.get_by_role('button',name='Alterar favorito',exact=True).wait_for()")
          test.write_text(text)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: |
          cd aninexus_frontend && bun install --frozen-lockfile && cd ..
          pip install -q -r requirements.txt pytest pytest-asyncio ruff playwright
          python -m playwright install --with-deps chromium >/tmp/source-browser-install.log 2>&1
          npm install --prefix /tmp/source-browser-tools agent-browser
      - name: Build and synchronize production frontend
        run: |
          cd aninexus_frontend && bun run build && cd ..
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
      - name: Full Python regression and critical lint
        run: |
          mkdir -p entrypoint-proof
          set -o pipefail
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q | tee entrypoint-proof/pytest.txt
      - name: Agent-browser real frontend check
        run: |
          mkdir -p entrypoint-proof
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --serve >/tmp/source-entrypoint-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/menu >/dev/null && break || sleep 1; done
          AB=/tmp/source-browser-tools/node_modules/.bin/agent-browser
          $AB --executable-path "$CHROMIUM_PATH" open http://127.0.0.1:8765/menu#shop
          $AB wait --load networkidle
          $AB snapshot -i >entrypoint-proof/agent-shop.txt
          $AB screenshot entrypoint-proof/agent-shop.png
          $AB close
      - name: Verify canonical entrypoint and stale version notices
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_single_miniapp_browser.py --output entrypoint-proof/single
      - name: Existing native, fullscreen and profile regressions
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output entrypoint-proof/native
          python scripts/verify_fullscreen_browser.py --output entrypoint-proof/fullscreen
          python scripts/verify_profile_identity_browser.py --output entrypoint-proof/profile
      - name: Commit only verified application source and compiled runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aninexus_frontend aninexus_runtime bot.py commands utils/miniapp_links.py utils/miniapp_menu.py webapp_routes/native_webapps.py tests scripts docs/single-miniapp.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: one canonical Source MiniApp, persistent menu and stale-version notice'
            git push origin HEAD:codex/source-single-miniapp-20260925
          fi
          git rev-parse HEAD >entrypoint-proof/source-sha.txt
          cp aninexus_runtime/ui-version.json entrypoint-proof/ui-version.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-single-miniapp-proof
          path: entrypoint-proof/
          retention-days: 7
