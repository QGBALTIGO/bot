name: Source single MiniApp workbench
on:
  push:
    branches: [codex/source-single-miniapp-20260925]
    paths: ['.github/workflows/source-entrypoint-workbench.yml', '.source-entrypoint-patch/**']
permissions:
  contents: write
concurrency:
  group: source-single-miniapp-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified entrypoint patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          folder = Path('.source-entrypoint-patch')
          if folder.exists():
              encoded = ''.join(p.read_text().strip() for p in sorted(folder.glob('*.b64')))
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == 'b65a0a985d75be72a7fcd2880233db54f8ca6def4c2e7af688a9a00b39e4b46d'
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              subprocess.run(['git', 'rm', '-r', '.source-entrypoint-patch'], check=True)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: |
          cd aninexus_frontend && bun install --frozen-lockfile && cd ..
          pip install -q -r requirements.txt pytest pytest-asyncio ruff playwright
          python -m playwright install --with-deps chromium >/tmp/source-browser-install.log 2>&1
          npm install --prefix /tmp/source-browser-tools agent-browser
      - name: Build and synchronize production frontend
        run: |
          cd aninexus_frontend && bun run build && cd ..
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
      - name: Full Python regression and critical lint
        run: |
          mkdir -p entrypoint-proof
          set -o pipefail
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q | tee entrypoint-proof/pytest.txt
      - name: Agent-browser real frontend check
        run: |
          mkdir -p entrypoint-proof
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --serve >/tmp/source-entrypoint-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/menu >/dev/null && break || sleep 1; done
          AB=/tmp/source-browser-tools/node_modules/.bin/agent-browser
          $AB --executable-path "$CHROMIUM_PATH" open http://127.0.0.1:8765/menu#shop
          $AB wait --load networkidle
          $AB snapshot -i >entrypoint-proof/agent-shop.txt
          $AB screenshot entrypoint-proof/agent-shop.png
          $AB close
      - name: Verify canonical entrypoint and stale version notices
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_single_miniapp_browser.py --output entrypoint-proof/single
      - name: Existing native, fullscreen and profile regressions
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output entrypoint-proof/native
          python scripts/verify_fullscreen_browser.py --output entrypoint-proof/fullscreen
          python scripts/verify_profile_identity_browser.py --output entrypoint-proof/profile
      - name: Commit only verified source and compiled runtime to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aninexus_frontend aninexus_runtime bot.py commands utils/miniapp_links.py utils/miniapp_menu.py webapp_routes/native_webapps.py tests scripts docs/single-miniapp.md .github/workflows/native-webapps.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: one canonical Source MiniApp, persistent menu and stale-version notice'
            git push origin HEAD:codex/source-single-miniapp-20260925
          fi
          git rev-parse HEAD >entrypoint-proof/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-single-miniapp-proof
          path: entrypoint-proof/
          retention-days: 7
