name: Diagnose home programming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-programming-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print relevant implementation blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['premium_webapp_ui.py', 'webapp.py']
          keys = [
              'O mesmo card', 'versão paralela', 'versao paralela',
              'Próximos Episódios', 'Proximos Episodios', 'Programação', 'Programacao',
              'programacao', 'schedule', 'airing', 'nextAiringEpisode',
              'build_home_page', 'build_program', 'Imagem indisponível', 'Imagem indisponivel',
              'Título indisponível', 'Titulo indisponivel',
          ]
          for filename in files:
              lines = Path(filename).read_text(encoding='utf-8').splitlines()
              print(f'\n===== {filename} lines={len(lines)} =====')
              matches=[]
              for i,line in enumerate(lines,1):
                  if any(k.casefold() in line.casefold() for k in keys):
                      matches.append(i)
              merged=[]
              for line_no in matches:
                  if not merged or line_no-merged[-1] > 120:
                      merged.append(line_no)
              for line_no in merged:
                  start=max(1,line_no-55); end=min(len(lines),line_no+130)
                  print(f'\n--- {filename}:{start}-{end} match~{line_no} ---')
                  for n in range(start,end+1):
                      print(f'{n:05d}: {lines[n-1]}')
          PY
      - name: List routes and API fetches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for filename in ['webapp.py','premium_webapp_ui.py']:
              lines=Path(filename).read_text(encoding='utf-8').splitlines()
              print('\n==== ROUTES/FETCHES',filename,'====')
              for i,line in enumerate(lines,1):
                  low=line.casefold()
                  if ('@app.' in line or 'fetch(' in line or '/api/' in line) and any(x in low for x in ['program','air','schedule','home','season','temporad','episode','episod']):
                      print(f'{i:05d}: {line}')
          PY
      - name: Remove diagnostic workflow
        run: |
          rm -f .github/workflows/home-programming-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/home-programming-diagnostic.yml
          git commit -m 'Remove home programming diagnostic workflow'
          git push origin HEAD:main
