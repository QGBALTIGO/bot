name: Refresh card image cache across processes

on:
  push:
    paths:
      - 'scripts/apply_cards_cache_ttl.py'
      - '.github/workflows/cards-cache-ttl-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_cards_cache_ttl.py
      - name: Validate cache refresh code
        run: |
          python -m compileall -q cards_service.py utils/wallhaven_bulk_curator.py bot.py webapp.py
          git diff --check
          grep -q 'CARDS_CACHE_TTL_SECONDS' cards_service.py
          grep -q '_CACHE_LOADED_AT = time.monotonic()' cards_service.py
      - name: Remove one-shot files
        run: |
          rm -f scripts/apply_cards_cache_ttl.py
          rm -f .github/workflows/cards-cache-ttl-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh global card image cache across processes'
          git push origin HEAD:main
