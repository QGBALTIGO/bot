name: Apply profile collection extraction

on:
  push:
    branches:
      - v2/p1-webapp-profile-collection
    paths:
      - .github/workflows/apply-profile-collection-extraction.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-profile-collection
          fetch-depth: 0

      - name: Apply surgical extraction
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text, filename=str(path))

          remove_names = {
              '_web_image_url',
              '_menu_collection_characters',
              'api_menu_collection_characters',
              'api_menu_favorite',
          }
          ranges = []
          found = set()

          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in remove_names:
                  start = min([d.lineno for d in node.decorator_list] + [node.lineno])
                  end = node.end_lineno or node.lineno
                  ranges.append((start, end, node.name))
                  found.add(node.name)
                  continue

              if isinstance(node, ast.Assign):
                  names = {
                      target.id
                      for target in node.targets
                      if isinstance(target, ast.Name)
                  }
                  if 'DIRECT_IMAGE_HOSTS' in names:
                      ranges.append((node.lineno, node.end_lineno or node.lineno, 'DIRECT_IMAGE_HOSTS'))
                      found.add('DIRECT_IMAGE_HOSTS')

          expected = remove_names | {'DIRECT_IMAGE_HOSTS'}
          missing = expected - found
          if missing:
              raise SystemExit(f'Abortando: blocos esperados não encontrados: {sorted(missing)}')

          # DIRECT_IMAGE_HOSTS deve pertencer apenas ao helper legado que está sendo removido.
          direct_host_uses = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id == 'DIRECT_IMAGE_HOSTS' and isinstance(node.ctx, ast.Load):
                  direct_host_uses.append(node.lineno)
          legacy_helper = next(
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == '_web_image_url'
          )
          outside = [
              lineno for lineno in direct_host_uses
              if not (legacy_helper.lineno <= lineno <= (legacy_helper.end_lineno or legacy_helper.lineno))
          ]
          if outside:
              raise SystemExit(f'Abortando: DIRECT_IMAGE_HOSTS ainda é usado fora do helper legado: {outside}')

          for start, end, _ in sorted(ranges, reverse=True):
              del lines[start - 1:end]

          new_text = ''.join(lines)

          image_import = 'from utils.web_image_url import web_image_url as _web_image_url\n'
          collection_import = (
              'from webapp_services.profile_collection import '
              'menu_collection_characters as _menu_collection_characters\n'
          )

          if image_import not in new_text:
              marker = 'from utils.public_character_image import is_own_image_proxy_url\n'
              if marker not in new_text:
                  raise SystemExit('Abortando: ponto de inserção do helper de imagem não encontrado')
              new_text = new_text.replace(marker, marker + image_import, 1)

          if collection_import not in new_text:
              marker = 'from utils.webapp_identity import (\n'
              if marker not in new_text:
                  raise SystemExit('Abortando: ponto de inserção do serviço de coleção não encontrado')
              new_text = new_text.replace(marker, collection_import + marker, 1)

          # Garantias estruturais antes de gravar.
          parsed = ast.parse(new_text, filename=str(path))
          top_names = {
              node.name
              for node in parsed.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked = remove_names & top_names
          if leaked:
              raise SystemExit(f'Abortando: funções legadas permaneceram: {sorted(leaked)}')
          if 'DIRECT_IMAGE_HOSTS = {' in new_text:
              raise SystemExit('Abortando: constante legada permaneceu no monólito')

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes webapp_services utils
          python -m pytest -q tests/test_profile_collection_service.py tests/test_web_image_url.py tests/test_webapp_route_modularization.py

      - name: Commit final refactor
        run: |
          rm .github/workflows/apply-profile-collection-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrair coleção e favorito do perfil [profile-collection-extracted]"
          git push origin HEAD:v2/p1-webapp-profile-collection
