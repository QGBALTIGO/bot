name: AniNexus frontend

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "aninexus_frontend/**"
      - "aninexus_runtime/**"
      - "webapp_routes/aninexus_runtime.py"
      - ".github/workflows/aninexus-frontend.yml"
  push:
    branches: [main]
    paths:
      - "aninexus_frontend/**"
      - "aninexus_runtime/**"
      - "webapp_routes/aninexus_runtime.py"
      - ".github/workflows/aninexus-frontend.yml"

permissions:
  contents: read

concurrency:
  group: aninexus-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        working-directory: aninexus_frontend
        run: bun run build

      - name: Check AniNexus branding
        run: |
          if grep -RInE 'SEAL YOUR WAIFU|Seal Your Waifu|>SEAL<|\bSEAL\b' aninexus_frontend/src aninexus_frontend/index.html --exclude='README.md'; then
            echo 'Visible Seal branding found in AniNexus frontend.'
            exit 1
          fi

      - name: Verify committed runtime matches source
        run: diff -qr aninexus_frontend/dist aninexus_runtime
