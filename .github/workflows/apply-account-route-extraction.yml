name: Apply account route extraction

on:
  push:
    branches:
      - v2/p1-webapp-account-route
    paths:
      - .github/workflows/apply-account-route-extraction.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-account-route
          fetch-depth: 0

      - name: Install test runner
        run: python -m pip install -q pytest

      - name: Apply surgical extraction
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))

          route = next(
              (
                  node for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == 'api_menu_delete_account'
              ),
              None,
          )
          if route is None:
              raise SystemExit('Abortando: api_menu_delete_account não encontrada')

          loads = [
              node.lineno
              for node in ast.walk(tree)
              if isinstance(node, ast.Name)
              and node.id == 'delete_user_account'
              and isinstance(node.ctx, ast.Load)
          ]
          outside = [
              lineno for lineno in loads
              if not (route.lineno <= lineno <= (route.end_lineno or route.lineno))
          ]
          if outside:
              raise SystemExit(f'Abortando: delete_user_account possui usos adicionais: {outside}')

          import_line = '    delete_user_account,\n'
          if text.count(import_line) != 1:
              raise SystemExit(
                  f'Abortando: import esperado de delete_user_account não é único: {text.count(import_line)}'
              )

          lines = text.splitlines(keepends=True)
          start = min([d.lineno for d in route.decorator_list] + [route.lineno])
          end = route.end_lineno or route.lineno
          del lines[start - 1:end]
          new_text = ''.join(lines).replace(import_line, '', 1)

          parsed = ast.parse(new_text, filename=str(path))
          if any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == 'api_menu_delete_account'
              for node in parsed.body
          ):
              raise SystemExit('Abortando: rota legada permaneceu no monólito')
          if any(
              isinstance(node, ast.alias) and node.name == 'delete_user_account'
              for node in ast.walk(parsed)
          ):
              raise SystemExit('Abortando: import legado permaneceu no monólito')

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes utils
          python -m pytest -q \
            tests/test_account_route_architecture.py \
            tests/test_webapp_auth_invariants.py \
            tests/test_webapp_route_modularization.py

      - name: Commit final refactor
        run: |
          rm .github/workflows/apply-account-route-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrair rota de exclusão de conta [account-route-extracted]"
          git push origin HEAD:v2/p1-webapp-account-route
