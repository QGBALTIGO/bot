name: Activate strict Wallhaven character curation

on:
  push:
    paths:
      - 'scripts/apply_wallhaven_bulk_activation.py'
      - '.github/workflows/wallhaven-bulk-activation.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact activation patch
        run: python scripts/apply_wallhaven_bulk_activation.py
      - name: Validate runtime code
        run: |
          python -m compileall -q bot.py webapp.py utils/wallhaven_bulk_curator.py
          git diff --check
          grep -q 'wallhaven_bulk_curator_worker' bot.py
          grep -q 'global_character = get_character_by_id(char_id)' webapp.py
          ! grep -q 'resolve_character_portrait' webapp.py
      - name: Validate strict Wallhaven metadata filters with live API
        run: |
          python -m pip install httpx
          python - <<'PY'
          import httpx, re, unicodedata
          from difflib import SequenceMatcher

          def norm(v):
              t=unicodedata.normalize('NFKD', str(v or '').casefold())
              t=''.join(c for c in t if not unicodedata.combining(c))
              t=re.sub(r'[^a-z0-9]+',' ',t)
              return ' '.join(t.split())
          def sim(a,b):
              a,b=norm(a),norm(b)
              if not a or not b: return 0.0
              if a==b: return 1.0
              if len(a)>=4 and (a in b or b in a): return 0.9
              return SequenceMatcher(None,a,b).ratio()

          headers={'User-Agent':'SourceBaltigo-Strict-Curator-Smoke/1.0'}
          params={'q':'Frieren Sousou no Frieren','categories':'010','purity':'100','sorting':'relevance','order':'desc','atleast':'1000x1500','ratios':'2x3','page':'1'}
          with httpx.Client(timeout=20,follow_redirects=True,headers=headers) as client:
              r=client.get('https://wallhaven.cc/api/v1/search',params=params)
              r.raise_for_status()
              items=(r.json() or {}).get('data') or []
              accepted=0
              for item in items[:6]:
                  w=int(item.get('dimension_x') or 0); h=int(item.get('dimension_y') or 0)
                  if not h or w>=h or abs((w/h)-(2/3))>0.055: continue
                  d=client.get(f"https://wallhaven.cc/api/v1/w/{item['id']}")
                  d.raise_for_status()
                  tags=((d.json() or {}).get('data') or {}).get('tags') or []
                  chars=[t for t in tags if str(t.get('category') or '').lower()=='characters']
                  series=[t for t in tags if str(t.get('category') or '').lower()=='series']
                  cm=max([sim('Frieren',t.get('name')) for t in chars]+[0])
                  sm=max([sim('Sousou no Frieren',t.get('name')) for t in series]+[0])
                  if cm>=0.82 and sm>=0.58:
                      accepted+=1
              print('strict_accepted=',accepted)
              if accepted < 1:
                  raise SystemExit('strict Wallhaven filter found no validated character candidate')
          PY
      - name: Remove temporary activation/probe files
        run: |
          rm -f scripts/apply_wallhaven_bulk_activation.py
          rm -f .github/workflows/wallhaven-bulk-activation.yml
          rm -f .github/workflows/wallhaven-metadata-probe.yml
          rm -f utils/character_image_resolver.py
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Replace character images directly with strict Wallhaven curation'
          git push origin HEAD:main
