name: Source performance and favorite repair
on:
  push:
    branches: [codex/source-performance-favorites-20260925]
    paths: ['.source-repair/**', '.github/workflows/source-repair-validate.yml']
permissions:
  contents: write
concurrency:
  group: source-repair-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed final layout corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'aninexus_frontend/src/components/Header.tsx': [
              ('flex items-center justify-between px-3', 'flex items-center justify-between gap-2 px-3'),
              ('flex min-w-0 items-center gap-2 xs:gap-3', 'flex min-w-0 flex-1 items-center gap-2 xs:gap-3'),
              ('<div className="flex flex-col justify-center">', '<div className="flex min-w-0 flex-1 flex-col justify-center">'),
              ('<div className="flex items-center gap-1.5">', '<div className="flex min-w-0 items-center gap-1.5">'),
              ('className="text-[8px] font-mono text-zinc-500 uppercase">V2.4', 'className="hidden sm:inline shrink-0 text-[8px] font-mono text-zinc-500 uppercase">V2.4'),
            ],
            'aninexus_frontend/src/pages/Profile.tsx': [
              ('className="flex items-center gap-4 p-4" data-profile-favorite', 'className="grid grid-cols-[64px_minmax(0,1fr)] sm:flex items-center gap-x-4 gap-y-3 p-4" data-profile-favorite'),
              ('<Button size="sm" variant="secondary" aria-label="Alterar personagem favorito"', '<Button size="sm" variant="secondary" className="col-start-2 justify-self-start sm:shrink-0" aria-label="Alterar personagem favorito"'),
            ],
            'scripts/verify_native_browser.py': [
              ('get_by_role("button", name="Alterar", exact=True).click()', 'get_by_role("button", name="Alterar personagem favorito", exact=True).click()'),
              ('            assert page.locator("[data-profile-favorite]").count() == 0', '            page.locator("[data-profile-favorite]").wait_for(state="hidden")'),
              ('                    assert not overflow, ("overflow", path, width)', '''                    assert not overflow, ("overflow", path, width)
                              header_overlap = page.evaluate("""() => {
                                const header = document.querySelector('header.sticky');
                                const brand = header.querySelector('button[aria-label="Ir para o painel"]');
                                const stats = header.lastElementChild;
                                const edge = stats.getBoundingClientRect().left;
                                return Array.from(brand.querySelectorAll('span')).some(el => {
                                  const b = el.getBoundingClientRect();
                                  return b.width > 0 && b.right > edge + 1;
                                });
                              }""")
                              assert not header_overlap, ("header overlap", path, width)'''.replace('\n          ', '\n')),
            ],
          }
          for name, pairs in changes.items():
              path=Path(name)
              text=path.read_text()
              for old, new in pairs:
                  if old in text:
                      assert text.count(old) == 1, (name, old, text.count(old))
                      text=text.replace(old, new)
                  else:
                      assert new in text, (name, old)
              path.write_text(text)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ruff playwright
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/source-browser-tools agent-browser
          cd aninexus_frontend && bun install --frozen-lockfile
      - name: Compile frontend and synchronize runtime
        run: |
          cd aninexus_frontend && bun run build && cd ..
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align narrow headers and favorite profile controls'
            git push origin HEAD:codex/source-performance-favorites-20260925
          fi
      - name: Full regression and critical lint
        run: |
          mkdir -p repair-proof
          set -o pipefail
          ruff check . --select E9,F63,F7,F82 --exclude data
          python -m pytest -q | tee repair-proof/pytest.txt
      - name: Verify profile SQL against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          BOT_TOKEN: '123456:fixture-only-not-a-real-token'
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee repair-proof/postgres.txt
          import time
          import database as db
          from database_core import run, pool
          from webapp_services.profile_overview import load_menu_user_rows
          from database_aninexus_pets import get_companion_overview, get_user_pets, get_user_eggs
          db.create_tables()
          db.touch_user_identity(77, 'testuser', 'Teste')
          db.set_profile_favorite(77, 23)
          run('UPDATE users SET coins=51 WHERE user_id=%s', (77,))
          db.touch_user_identity(77, 'testuser2', 'Nome novo')
          user, progress, settings = load_menu_user_rows(77)
          assert user['coins'] == 51 and user['username'] == 'testuser2'
          assert settings['favorite_character_id'] == 23
          assert db.get_user_level_rank(77) == 1
          assert db.get_user_level_rank(77) == 1
          pets, eggs = get_companion_overview(77)
          assert pets == get_user_pets(77) and eggs == get_user_eggs(77)
          db.set_profile_favorite(77, None)
          assert load_menu_user_rows(77)[2]['favorite_character_id'] is None
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from webapp_routes.aninexus_me import build_aninexus_me_router
          from webapp_routes.aninexus_compat import _issue_session
          app = FastAPI()
          app.include_router(build_aninexus_me_router())
          token = _issue_session({'id':77, 'first_name':'Teste'})
          with TestClient(app) as client:
              start=time.monotonic()
              response=client.get('/api/v1_7b82/me', headers={'Authorization':'Bearer '+token})
              assert response.status_code == 200, response.text
              assert response.json()['balance'] == 51 and response.json()['favorite'] is None
              print('Disposable PostgreSQL: joins, identity upsert, companion serialization, favorite removal and /me passed.')
              print('Local disposable-database /me ms:', round((time.monotonic()-start)*1000))
          pool.close()
          PY
      - name: Agent-browser page check
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --serve >/tmp/source-repair-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/menu >/dev/null && break || sleep 1; done
          /tmp/source-browser-tools/node_modules/.bin/agent-browser --executable-path "$CHROMIUM_PATH" open http://127.0.0.1:8765/menu#settings
          /tmp/source-browser-tools/node_modules/.bin/agent-browser wait --load networkidle
          /tmp/source-browser-tools/node_modules/.bin/agent-browser snapshot -i >repair-proof/agent-snapshot.txt
          /tmp/source-browser-tools/node_modules/.bin/agent-browser screenshot repair-proof/agent-settings.png
          /tmp/source-browser-tools/node_modules/.bin/agent-browser close
      - name: Responsive, startup and favorite browser regression
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output repair-proof
      - name: Record reviewed source
        if: always()
        run: |
          mkdir -p repair-proof
          git rev-parse HEAD >repair-proof/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-repair-proof
          path: repair-proof/
          retention-days: 7
