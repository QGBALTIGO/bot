name: Diagnose menu programming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-programming-diagnostic.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect repository and live menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, urllib.request, urllib.error, re

          needles=['O mesmo card','versão paralela','TEMPORADA ATUAL','Próximos Episódios','Programação','Imagem indisponível','Título indisponível']
          print('=== REPO MATCHES ALL TEXT FILES ===')
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.stat().st_size > 2_000_000: continue
            try: t=p.read_text(encoding='utf-8')
            except Exception: continue
            for n in needles:
              if n.casefold() in t.casefold():
                for i,line in enumerate(t.splitlines(),1):
                  if n.casefold() in line.casefold(): print(p, i, repr(line.strip()))
          print('\n=== MENU DEFINITIONS ===')
          for fn in ['premium_webapp_ui.py','webapp.py']:
            t=Path(fn).read_text(encoding='utf-8'); tree=ast.parse(t)
            lines=t.splitlines()
            for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and 'menu' in node.name.casefold():
                print(fn,node.name,node.lineno,getattr(node,'end_lineno',node.lineno))
                start=max(1,node.lineno-5); end=min(len(lines),getattr(node,'end_lineno',node.lineno)+5)
                if end-start<=450:
                  for i in range(start,end+1): print(f'{fn}:{i:05d}: {lines[i-1]}')
          print('\n=== LIVE MENU ===')
          for path in ['/menu?uid=1','/menu?uid=1&lang=pt','/menu']:
            url='https://bot-production-1980.up.railway.app'+path
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Baltigo-Diagnostic/1.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read(500000).decode('utf-8','replace')
                print('URL',path,'STATUS',r.status,'LEN',len(body))
                for n in needles: print(' ',repr(n), n.casefold() in body.casefold())
                apis=sorted(set(re.findall(r'["\'](/api/[^"\']+)',body)))
                print(' APIS',apis[:80])
                hrefs=sorted(set(re.findall(r'href=["\']([^"\']+)',body)))
                print(' HREFS',hrefs[:80])
            except urllib.error.HTTPError as e:
              print('URL',path,'HTTP',e.code,e.read(500).decode('utf-8','replace'))
            except Exception as e: print('URL',path,'ERROR',repr(e))
          PY
      - name: Remove workflow
        run: |
          rm -f .github/workflows/menu-programming-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/menu-programming-diagnostic.yml
          git commit -m 'Remove menu programming diagnostic workflow'
          git push origin HEAD:main
