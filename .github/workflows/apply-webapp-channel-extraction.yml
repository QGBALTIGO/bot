name: Apply WebApp channel route extraction

on:
  push:
    branches:
      - v2/p1-channel-routes

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[channel-routes-extracted]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-channel-routes
          fetch-depth: 0

      - name: Apply surgical extraction
        run: python scripts/apply_webapp_channel_extraction.py

      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extrair rotas de canal do webapp [channel-routes-extracted]"
          git push origin HEAD:v2/p1-channel-routes
