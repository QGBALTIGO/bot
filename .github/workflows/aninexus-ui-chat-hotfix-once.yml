name: AniNexus UI chat hotfix once

on:
  push:
    branches:
      - fix/aninexus-ui-chat-delivery

permissions:
  contents: write

concurrency:
  group: aninexus-ui-chat-hotfix-once
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/aninexus-ui-chat-delivery

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Normalize one-time patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/hotfix_aninexus_ui_chat.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    (") Prisms)", ") Dados)"),',
              '    (" Prisms)", " Dados)"),',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply hotfix
        run: python scripts/hotfix_aninexus_ui_chat.py

      - name: Install frontend dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: aninexus_frontend
        run: bun run build

      - name: Publish runtime
        run: |
          rm -rf aninexus_runtime
          cp -R aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime

      - name: Compile Python
        run: python -m compileall -q .

      - name: Remove one-time files
        run: |
          rm -f scripts/hotfix_aninexus_ui_chat.py
          rm -f .github/workflows/aninexus-ui-chat-hotfix-once.yml

      - name: Commit generated hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: traduzir MiniApp e restaurar entrega do Dado no chat'
          git push origin HEAD:fix/aninexus-ui-chat-delivery
