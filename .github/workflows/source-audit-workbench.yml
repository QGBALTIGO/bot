name: Source deep audit workbench
on:
  push:
    branches: [codex/source-deep-audit-20260925]
    paths: ['.github/workflows/source-audit-workbench.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: synthetic-audit-only
          POSTGRES_DB: source_audit
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply isolated probes
        run: |
          python - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(Path('.source-audit/probe.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='f30958b26f3665594b0b1415b7787a47685a550ca754ccf385844399f2dcfa55'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - run: pip install -q -r requirements.txt pytest pytest-asyncio pip-audit
      - name: Probe the actual assembled application
        env:
          SOURCE_AUDIT_DATABASE_URL: postgresql://audit:synthetic-audit-only@127.0.0.1:5432/source_audit
        run: |
          mkdir -p audit-runtime
          python scripts/audit_inventory.py --output audit-runtime/inventory.json
          python scripts/audit_runtime.py audit-runtime >audit-runtime/console.txt 2>&1
      - name: Current Python advisories
        if: always()
        run: |
          pip-audit --format json --output audit-runtime/python-advisories.json >audit-runtime/python-advisories.log 2>&1
          echo $? >audit-runtime/python-advisories-exit.txt
        shell: bash {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-runtime-baseline
          path: audit-runtime/
          retention-days: 7
