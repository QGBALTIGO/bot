name: Source deep audit workbench
on:
  push:
    branches: [codex/source-deep-audit-20260925]
    paths: ['.github/workflows/source-audit-workbench.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > /tmp/source-audit-baseline.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit-baseline
          path: /tmp/source-audit-baseline.tar.gz
          retention-days: 3
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install isolated tools
        run: |
          pip install -q -r requirements.txt pytest pytest-asyncio pytest-cov bandit pip-audit ruff
          cd aninexus_frontend && bun install --frozen-lockfile
      - name: Collect baseline tests and syntax findings
        run: |
          mkdir -p audit-baseline
          python -m compileall -q -x '/(node_modules|\.git)/' . >audit-baseline/compile.txt 2>&1; echo $? >audit-baseline/compile-exit.txt
          python -m pytest -q --cov=. --cov-report=json:audit-baseline/coverage.json --junitxml=audit-baseline/pytest.xml >audit-baseline/pytest.txt 2>&1; echo $? >audit-baseline/pytest-exit.txt
          ruff check . --output-format json --exclude data --exclude aninexus_frontend/node_modules >audit-baseline/ruff.json; echo $? >audit-baseline/ruff-exit.txt
          bandit -r . -x './.git,./aninexus_frontend/node_modules,./tests' -f json -o audit-baseline/bandit.json >audit-baseline/bandit.log 2>&1; echo $? >audit-baseline/bandit-exit.txt
        shell: bash {0}
      - name: Current dependency advisory checks
        run: |
          pip-audit --disable-pip --no-deps --format json --output audit-baseline/python-advisories.json >audit-baseline/python-advisories.log 2>&1; echo $? >audit-baseline/python-advisories-exit.txt
          cd aninexus_frontend
          bun audit --json >../audit-baseline/js-advisories.json 2>../audit-baseline/js-advisories.log; echo $? >../audit-baseline/js-advisories-exit.txt
          bun run build >../audit-baseline/build.txt 2>&1; echo $? >../audit-baseline/build-exit.txt
          diff -qr dist ../aninexus_runtime >../audit-baseline/runtime-diff.txt; echo $? >../audit-baseline/runtime-exit.txt
        shell: bash {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-baseline-results
          path: audit-baseline/
          retention-days: 7
