name: Inspect WebApp auth core

on:
  push:
    branches:
      - v2/p1-webapp-auth-core

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-webapp-auth-core
          fetch-depth: 0

      - name: Print auth core source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text, filename=str(path))

          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == '_resolve_webapp_user':
                  start = max(1, node.lineno - 45)
                  end = min(len(lines), (node.end_lineno or node.lineno) + 15)
                  print(f'=== _resolve_webapp_user lines {node.lineno}-{node.end_lineno} / context {start}-{end} ===')
                  for idx in range(start, end + 1):
                      print(f'{idx:05d}: {lines[idx - 1]}')

          needles = [
              'ALLOW_INSECURE_WEBAPP_UID_FALLBACK',
              'WEBAPP_INITDATA_MAX_AGE_SECONDS',
              'WEBAPP_INITDATA_FUTURE_SKEW_SECONDS',
              'TELEGRAM_WEBAPP_BOT_ID',
              'validate_telegram_init_data',
          ]
          for needle in needles:
              hits = [i for i, line in enumerate(lines, start=1) if needle in line]
              print(f'=== {needle}: {hits} ===')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-webapp-auth-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de auth [auth-inspection-done]"
          git push origin HEAD:v2/p1-webapp-auth-core
