name: Dado chat delivery fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dado-chat-delivery-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact Dado delivery patch
        run: python scripts/_fix_dado_chat_delivery.py

      - name: Validate Python and patch shape
        shell: bash
        run: |
          python -m compileall -q bot.py webapp.py utils/telegram_outbox.py
          grep -q 'telegram_outbox_worker' bot.py
          grep -q 'dedupe_key=f"dado:{user_id}:{roll_id}"' webapp.py
          git diff --check

      - name: Remove one-shot patch files
        run: |
          git rm scripts/_fix_dado_chat_delivery.py
          git rm .github/workflows/dado-chat-delivery-fix.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py webapp.py utils/telegram_outbox.py
          git commit -m "Restore Dado reward delivery to Telegram chat"
          git push origin HEAD:main
