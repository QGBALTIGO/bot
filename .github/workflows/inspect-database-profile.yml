name: Inspect database profile domain

on:
  push:
    branches:
      - v2/p1-database-profile

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-database-profile
          fetch-depth: 0

      - name: Inspect profile functions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('database.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text, filename=str(path))

          exact = {
              'create_profile_settings_table',
              'get_profile_settings',
              'set_profile_nickname',
              'set_profile_favorite',
              'set_profile_country',
              'set_profile_language',
              'set_profile_private',
              'set_profile_notifications',
              'delete_user_account',
          }
          found = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in exact:
                  found.append(node)

          print('=== functions ===')
          for node in found:
              calls = sorted({
                  child.func.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Name)
              })
              print(f'{node.name}: {node.lineno}-{node.end_lineno}; calls={calls}')
              for i in range(node.lineno, (node.end_lineno or node.lineno) + 1):
                  print(f'{i:05d}: {lines[i-1]}')
              print()

          missing = sorted(exact - {node.name for node in found})
          print(f'=== missing: {missing} ===')
          PY

      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/inspect-database-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover inspeção temporária de perfil [db-profile-inspection-done]"
          git push origin HEAD:v2/p1-database-profile
