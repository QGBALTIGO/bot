name: Source native migration validation
on:
  push:
    branches: [codex/unify-source-webapps-20260925]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-native-migration
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/unify-source-webapps-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified native source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          directory = Path('.source-native-transport')
          if directory.exists():
              encoded = ''.join(p.read_text().strip() for p in sorted(directory.glob('*.b64')))
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == 'cdad08d63e04f8cfcf9e65170f83ba1a83e5f942a54882af0f9b3d2d6e323b85', 'Source patch checksum mismatch'
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              subprocess.run(['git', 'rm', '-r', '.source-native-transport'], check=True)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff playwright
          npm install --prefix /tmp/source-browser-tools agent-browser
          python -m playwright install --with-deps chromium
      - name: Compile native frontend
        working-directory: aninexus_frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Synchronize production runtime
        run: |
          rm -rf aninexus_runtime
          cp -a aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime
      - name: Commit source and compiled runtime to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aninexus_frontend aninexus_runtime webapp_routes/native_webapps.py webapp_entrypoint.py bot.py tests scripts/verify_native_browser.py docs/native-webapps.md .github/workflows/native-webapps.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat: incorporate legacy Source WebApps into the native menu'
            git push origin HEAD:codex/unify-source-webapps-20260925
          fi
      - name: Python syntax and critical lint
        run: |
          python -m compileall -q bot.py webapp_entrypoint.py webapp_routes/native_webapps.py scripts/verify_native_browser.py tests/test_native_webapps.py tests/test_native_nickname_transactions.py
          ruff check . --select E9,F63,F7,F82 --exclude data
      - name: Full regression suite
        run: python -m pytest -q
      - name: Agent-browser native page verification
        run: |
          mkdir -p native-proof
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --serve >native-proof/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/cards >/dev/null && break || sleep 1; done
          browser=/tmp/source-browser-tools/node_modules/.bin/agent-browser
          "$browser" --executable-path "$CHROMIUM_PATH" --args '--no-sandbox' open http://127.0.0.1:8765/cards
          "$browser" wait --load networkidle
          "$browser" snapshot -i | tee native-proof/agent-snapshot.txt
          "$browser" screenshot native-proof/agent-check.png
          "$browser" errors | tee native-proof/agent-errors.txt
          "$browser" close
          kill "$server"
          wait "$server" || true
          trap - EXIT
      - name: Mobile, desktop and transaction UI regression
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')"
          python scripts/verify_native_browser.py --test --output native-proof
      - name: Remove temporary migration workflow after verified success
        run: |
          git rm .github/workflows/source-native-validation.yml
          git commit -m 'ci: retain permanent native WebApp regression checks'
          git push origin HEAD:codex/unify-source-webapps-20260925
      - name: Package review evidence and resulting source
        if: always()
        run: |
          mkdir -p native-proof
          git rev-parse HEAD >native-proof/validated-source-sha.txt
          tar --exclude='.git' --exclude='node_modules' --exclude='data' --exclude='*.session*' --exclude='.env' --exclude='native-proof' --exclude='__pycache__' -czf /tmp/source-native-review.tar.gz aninexus_frontend aninexus_runtime webapp_routes/native_webapps.py webapp_entrypoint.py bot.py tests scripts/verify_native_browser.py docs/native-webapps.md .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-native-proof
          path: |
            native-proof/
            /tmp/source-native-review.tar.gz
          retention-days: 3
