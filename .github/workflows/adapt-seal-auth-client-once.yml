name: Adapt Seal auth client once

on:
  push:
    branches:
      - v2/seal-fusion
    paths:
      - .github/workflows/adapt-seal-auth-client-once.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/seal-fusion
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Inject Source Telegram auth headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/api/client.ts')
          text = path.read_text(encoding='utf-8')
          marker = "  const headers = mergeHeaders(options.headers);\n"
          if marker not in text:
              raise SystemExit('apiFetch header marker not found')
          insertion = marker + """  // Source Baltigo keeps Telegram initData as the canonical request identity.\n  // The imported frontend may still use its local session token for compatibility,\n  // but private Source endpoints never trust a browser-supplied uid by itself.\n  const tg = getTg();\n  if (tg?.initData) {\n    headers['X-Telegram-Init-Data'] = tg.initData;\n  }\n  const telegramUserId = tg?.initDataUnsafe?.user?.id;\n  if (telegramUserId) {\n    headers['X-WebApp-Uid'] = String(telegramUserId);\n  }\n"""
          if "headers['X-Telegram-Init-Data']" in text:
              raise SystemExit('Source auth headers already installed')
          path.write_text(text.replace(marker, insertion, 1), encoding='utf-8')
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run type-check
          bun run build

      - name: Commit auth adaptation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/adapt-seal-auth-client-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: usar autenticação Telegram assinada do Source no frontend v2"
          git push origin HEAD:v2/seal-fusion
