name: AniNexus finalize once

on:
  push:
    branches:
      - v2/aninexus-platform

permissions:
  contents: write

concurrency:
  group: aninexus-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/aninexus-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Apply finalization patch
        run: python scripts/finalize_aninexus_platform.py

      - name: Install frontend dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: aninexus_frontend
        run: bun run build

      - name: Verify AniNexus branding
        run: |
          if grep -RInE 'SEAL YOUR WAIFU|Seal Your Waifu|>SEAL<|\bSEAL\b' aninexus_frontend/src aninexus_frontend/index.html --exclude='README.md'; then
            echo 'Visible Seal branding found.'
            exit 1
          fi

      - name: Publish runtime
        run: |
          rm -rf aninexus_runtime
          cp -R aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime

      - name: Compile Python
        run: python -m compileall -q .

      - name: Remove one-time files
        run: |
          rm -f scripts/finalize_aninexus_platform.py
          rm -f .github/workflows/aninexus-finalize-once.yml

      - name: Commit finalized platform
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalizar sistemas funcionais da plataforma AniNexus'
          git push origin HEAD:v2/aninexus-platform
