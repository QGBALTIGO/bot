name: Apply menu dead UI removal

on:
  push:
    branches:
      - v2/p1-menu-dead-ui
    paths:
      - .github/workflows/apply-menu-dead-ui-removal.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-menu-dead-ui
          fetch-depth: 0

      - name: Install test runner
        run: python -m pip install -q pytest

      - name: Remove dead UI and legacy page route
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('webapp.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))

          assignment_names = {'MENU_HTML', 'MENU_BACKGROUND_URL', 'MENU_BANNER_URL'}
          assignments = {}
          menu_page = None

          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in assignment_names:
                          assignments[target.id] = node
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'menu_page':
                  menu_page = node

          missing = assignment_names - assignments.keys()
          if missing or menu_page is None:
              raise SystemExit(
                  f'Abortando: blocos esperados ausentes: assignments={sorted(missing)}, menu_page={menu_page is not None}'
              )

          def load_lines(symbol: str) -> list[int]:
              return [
                  node.lineno
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name)
                  and node.id == symbol
                  and isinstance(node.ctx, ast.Load)
              ]

          if load_lines('MENU_HTML'):
              raise SystemExit(f'Abortando: MENU_HTML possui consumidores: {load_lines("MENU_HTML")}')
          if load_lines('MENU_BACKGROUND_URL'):
              raise SystemExit(
                  f'Abortando: MENU_BACKGROUND_URL possui consumidores: {load_lines("MENU_BACKGROUND_URL")}'
              )

          page_start = menu_page.lineno
          page_end = menu_page.end_lineno or menu_page.lineno
          banner_outside = [
              lineno for lineno in load_lines('MENU_BANNER_URL')
              if not (page_start <= lineno <= page_end)
          ]
          builder_outside = [
              lineno for lineno in load_lines('build_menu_page_html')
              if not (page_start <= lineno <= page_end)
          ]
          if banner_outside:
              raise SystemExit(f'Abortando: MENU_BANNER_URL possui usos adicionais: {banner_outside}')
          if builder_outside:
              raise SystemExit(f'Abortando: build_menu_page_html possui usos adicionais: {builder_outside}')

          ranges = []
          for name, node in assignments.items():
              ranges.append((node.lineno, node.end_lineno or node.lineno, name))
          start = min([d.lineno for d in menu_page.decorator_list] + [menu_page.lineno])
          ranges.append((start, menu_page.end_lineno or menu_page.lineno, 'menu_page'))

          lines = text.splitlines(keepends=True)
          for start, end, _ in sorted(ranges, reverse=True):
              del lines[start - 1:end]

          new_text = ''.join(lines)
          import_line = '    build_menu_page as build_menu_page_html,\n'
          if new_text.count(import_line) != 1:
              raise SystemExit(
                  f'Abortando: import do builder do menu não é único: {new_text.count(import_line)}'
              )
          new_text = new_text.replace(import_line, '', 1)

          parsed = ast.parse(new_text, filename=str(path))
          for symbol in assignment_names | {'build_menu_page_html'}:
              if any(
                  isinstance(node, ast.Name) and node.id == symbol
                  for node in ast.walk(parsed)
              ):
                  raise SystemExit(f'Abortando: símbolo legado permaneceu: {symbol}')
          if any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'menu_page'
              for node in parsed.body
          ):
              raise SystemExit('Abortando: menu_page legada permaneceu')

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes webapp_services utils
          python -m pytest -q \
            tests/test_profile_page_architecture.py \
            tests/test_account_route_architecture.py \
            tests/test_profile_overview_architecture.py \
            tests/test_webapp_route_modularization.py

      - name: Commit final cleanup
        run: |
          rm .github/workflows/apply-menu-dead-ui-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remover UI legada morta do menu [menu-dead-ui-removed]"
          git push origin HEAD:v2/p1-menu-dead-ui
