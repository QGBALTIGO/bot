name: Wallhaven metadata probe

on:
  push:
    paths:
      - '.github/workflows/wallhaven-metadata-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Inspect search and wallpaper detail metadata
        run: |
          python - <<'PY'
          import json
          import httpx

          params = {
              'q': 'Frieren Sousou no Frieren',
              'categories': '010',
              'purity': '100',
              'sorting': 'relevance',
              'order': 'desc',
              'atleast': '1000x1500',
              'ratios': '2x3',
              'page': '1',
          }
          headers = {'User-Agent': 'SourceBaltigo-Metadata-Probe/1.0'}
          with httpx.Client(timeout=20, follow_redirects=True, headers=headers) as client:
              response = client.get('https://wallhaven.cc/api/v1/search', params=params)
              print('search_status=', response.status_code)
              response.raise_for_status()
              items = (response.json() or {}).get('data') or []
              print('search_count=', len(items))
              if not items:
                  raise SystemExit('no results')
              first = items[0]
              print('search_keys=', sorted(first.keys()))
              print('search_sample=', json.dumps(first, ensure_ascii=False)[:5000])
              wid = first['id']
              detail = client.get(f'https://wallhaven.cc/api/v1/w/{wid}')
              print('detail_status=', detail.status_code)
              detail.raise_for_status()
              payload = (detail.json() or {}).get('data') or {}
              print('detail_keys=', sorted(payload.keys()))
              tags = payload.get('tags') or []
              print('tags_count=', len(tags))
              for tag in tags:
                  print('TAG', json.dumps({k: tag.get(k) for k in ('id','name','alias','category','category_id','purity')}, ensure_ascii=False))
          PY
