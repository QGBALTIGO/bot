name: System audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/system-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Critical Python diagnostics
        run: ruff check . --select E9,F63,F7,F82 --exclude data
      - name: Structural runtime audit
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re
          from collections import defaultdict

          roots = [p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          findings = []

          for path in roots:
              try:
                  text = path.read_text(encoding='utf-8')
                  tree = ast.parse(text, filename=str(path))
              except Exception as exc:
                  findings.append((str(path), 0, 'PARSE', str(exc)))
                  continue

              # Duplicate top-level definitions can silently shadow runtime code.
              defs = defaultdict(list)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      defs[node.name].append(node.lineno)
              for name, lines in defs.items():
                  if len(lines) > 1:
                      findings.append((str(path), lines[-1], 'DUPDEF', f'{name}: {lines}'))

              # FastAPI duplicate path+method decorators inside a module.
              routes = defaultdict(list)
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for dec in node.decorator_list:
                      if not isinstance(dec, ast.Call) or not isinstance(dec.func, ast.Attribute):
                          continue
                      method = dec.func.attr.lower()
                      if method not in {'get','post','put','patch','delete','options','head'}:
                          continue
                      if dec.args and isinstance(dec.args[0], ast.Constant) and isinstance(dec.args[0].value, str):
                          routes[(method.upper(), dec.args[0].value)].append((node.name, node.lineno))
              for key, vals in routes.items():
                  if len(vals) > 1:
                      findings.append((str(path), vals[-1][1], 'DUPROUTE', f'{key}: {vals}'))

              # Blocking sleep inside async code.
              for node in ast.walk(tree):
                  if not isinstance(node, ast.AsyncFunctionDef):
                      continue
                  for sub in ast.walk(node):
                      if isinstance(sub, ast.Call) and isinstance(sub.func, ast.Attribute):
                          if isinstance(sub.func.value, ast.Name) and sub.func.value.id == 'time' and sub.func.attr == 'sleep':
                              findings.append((str(path), sub.lineno, 'ASYNC_BLOCK', f'time.sleep inside async {node.name}'))

              # SQL executed from f-strings is injection-prone even when values seem internal.
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr in {'execute','executemany'}:
                      if node.args and isinstance(node.args[0], ast.JoinedStr):
                          findings.append((str(path), node.lineno, 'SQL_FSTRING', 'SQL f-string passed to execute'))

              # HTTP calls without an explicit timeout are a deployment hang risk.
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  name = ''
                  if isinstance(func, ast.Attribute) and isinstance(func.value, ast.Name):
                      name = f'{func.value.id}.{func.attr}'
                  if name in {'requests.get','requests.post','requests.put','requests.patch','requests.delete','httpx.get','httpx.post'}:
                      if not any(k.arg == 'timeout' for k in node.keywords):
                          findings.append((str(path), node.lineno, 'HTTP_TIMEOUT', name))

          print('=== STRUCTURAL FINDINGS ===')
          for item in sorted(findings):
              print(':'.join(map(str, item)))
          print(f'TOTAL_FINDINGS={len(findings)}')
          PY
      - name: High severity security scan
        run: bandit -r . -x ./data -lll -f screen || true
