name: System audit

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**/*.py"
      - "**/*.json"
      - "requirements.txt"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/system-audit.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.json"
      - "requirements.txt"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/system-audit.yml"

permissions:
  contents: read

concurrency:
  group: system-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit
          python -m pip check

      - name: Compile every Python module
        run: python -m compileall -q .

      - name: Critical Python diagnostics
        run: python -m ruff check . --select E9,F63,F7,F82 --exclude data

      - name: Repository structural and secret audit
        run: python scripts/system_audit.py

      - name: High-severity source security scan
        run: python -m bandit -r . -x ./data,./tests -lll

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Run unit tests when present
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m unittest discover -s tests -v
          else
            echo "No unit tests found yet."
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-audit-report
          path: artifacts/system-audit.json
          if-no-files-found: warn
          retention-days: 14
