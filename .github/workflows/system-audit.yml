name: System audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/system-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/system-audit.yml"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit pip-audit
          pip check

      - name: Compile every Python module
        run: python -m compileall -q .

      - name: Critical Python diagnostics
        run: ruff check . --select E9,F63,F7,F82 --exclude data

      - name: Structural runtime gate
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          from collections import defaultdict

          excluded = {
              ".git", ".venv", "venv", "node_modules", "__pycache__",
              ".pytest_cache", ".ruff_cache",
          }
          findings = []

          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=str(path))

              definitions = defaultdict(list)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      definitions[node.name].append(node.lineno)
              for name, lines in definitions.items():
                  if len(lines) > 1:
                      findings.append(
                          f"{path}:{lines[-1]}: duplicate top-level definition {name}: {lines}"
                      )

              routes = defaultdict(list)
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call):
                          continue
                      if not isinstance(decorator.func, ast.Attribute):
                          continue
                      method = decorator.func.attr.lower()
                      if method not in {"get", "post", "put", "patch", "delete", "options", "head"}:
                          continue
                      if (
                          decorator.args
                          and isinstance(decorator.args[0], ast.Constant)
                          and isinstance(decorator.args[0].value, str)
                      ):
                          routes[(method.upper(), decorator.args[0].value)].append(
                              (node.name, node.lineno)
                          )
              for route, definitions_for_route in routes.items():
                  if len(definitions_for_route) > 1:
                      findings.append(
                          f"{path}:{definitions_for_route[-1][1]}: duplicate route "
                          f"{route}: {definitions_for_route}"
                      )

              for async_node in ast.walk(tree):
                  if not isinstance(async_node, ast.AsyncFunctionDef):
                      continue
                  for node in ast.walk(async_node):
                      if not isinstance(node, ast.Call):
                          continue
                      if (
                          isinstance(node.func, ast.Attribute)
                          and isinstance(node.func.value, ast.Name)
                          and node.func.value.id == "time"
                          and node.func.attr == "sleep"
                      ):
                          findings.append(
                              f"{path}:{node.lineno}: time.sleep inside async "
                              f"function {async_node.name}"
                          )

          if findings:
              print("\n".join(sorted(findings)))
              raise SystemExit(f"Structural gate failed with {len(findings)} finding(s)")

          print("Structural gate passed")
          PY

      - name: Run unit tests
        env:
          BOT_TOKEN: "123456789:test-token-for-imports-only"
          BOT_OWNER_ID: "1"
          PYTHONPATH: "."
        run: python -m pytest -q

      - name: High-severity source security scan
        continue-on-error: true
        run: bandit -r . -x ./data,./tests -lll -f screen

      - name: Dependency vulnerability report
        continue-on-error: true
        run: pip-audit -r requirements.txt
