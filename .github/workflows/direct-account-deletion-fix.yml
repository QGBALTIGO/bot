name: Direct account deletion hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-account-deletion-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-account-deletion-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip check

      - name: Apply atomic deletion patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/account-deletion.patch
          git apply --check /tmp/account-deletion.patch
          git apply /tmp/account-deletion.patch

      - name: Remove temporary workflow
        run: rm -f .github/workflows/direct-account-deletion-fix.yml

      - name: Validate and test
        run: |
          python -m compileall -q .
          git diff --check
          python -m pytest -q

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.py tests/test_account_deletion.py
          git add -u .github/workflows/direct-account-deletion-fix.yml
          git commit -m "fix: make account deletion atomic and comprehensive"
          git push origin HEAD:main
