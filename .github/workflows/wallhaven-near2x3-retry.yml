name: Wallhaven near-2x3 popular retry

on:
  push:
    paths:
      - ".github/workflows/wallhaven-near2x3-retry.yml"

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install httpx
      - name: Retry popular portraits
        env:
          WALLHAVEN_API_KEY: ${{ secrets.WALLHAVEN_API_KEY }}
          WALLHAVEN_CURATOR_DELAY: "1.45"
        run: python scripts/curate_wallhaven_characters.py --offset 0 --limit 25 --apply --retry-misses
      - name: Validate strict solo near-2x3 set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/wallhaven_character_overrides.json').read_text(encoding='utf-8'))
          chars=d.get('characters') or {}
          print('TOTAL',len(chars))
          for cid,row in chars.items():
              ratio=float(row.get('ratio') or 0)
              assert not (row.get('other_characters') or [])
              assert int(row.get('width') or 0)>=1000
              assert int(row.get('height') or 0)>=1500
              assert abs(ratio-(2/3))<=0.045
              assert float(row.get('score') or 0)>=82
              print('OK',cid,row.get('character_name'),'/',row.get('anime'),row.get('width'),row.get('height'),'ratio=',ratio,'score=',row.get('score'),'wh=',row.get('wallhaven_id'))
          PY
          git diff --check
      - run: rm -f .github/workflows/wallhaven-near2x3-retry.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallhaven_character_overrides.json data/wallhaven_curation_state.json .github/workflows/wallhaven-near2x3-retry.yml
          git diff --cached --quiet && exit 0
          git commit -m "Expand strict Wallhaven portraits with near-2x3 sources"
          git push origin HEAD:main
