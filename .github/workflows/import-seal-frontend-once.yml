name: Import Seal frontend once

on:
  push:
    branches:
      - v2/seal-fusion
    paths:
      - .github/workflows/import-seal-frontend-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Baltigo
        uses: actions/checkout@v4
        with:
          ref: v2/seal-fusion
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Import upstream frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/seal
          git clone --depth 1 https://github.com/bisug/seal-your-waifu-bot.git /tmp/seal
          SEAL_SHA="$(git -C /tmp/seal rev-parse HEAD)"

          rm -rf frontend
          mkdir -p frontend THIRD_PARTY_LICENSES
          cp -a /tmp/seal/frontend/. frontend/
          cp /tmp/seal/LICENSE THIRD_PARTY_LICENSES/SEAL_YOUR_WAIFU_LICENSE.txt

          cat > THIRD_PARTY_NOTICES.md <<EOF
          # Third-party notices

          ## Seal Your Waifu Bot

          Portions of the Source Baltigo 2.0 frontend are adapted from **Seal Your Waifu Bot** by **bisug**.

          - Upstream: https://github.com/bisug/seal-your-waifu-bot
          - Imported commit: ${SEAL_SHA}
          - Upstream license copy: \`THIRD_PARTY_LICENSES/SEAL_YOUR_WAIFU_LICENSE.txt\`

          Source Baltigo modifications must not misrepresent the origin of the imported code. Character artwork and other third-party media are tracked separately from the upstream software license.
          EOF

          cat > frontend/UPSTREAM.md <<EOF
          # Upstream frontend

          This frontend started from the public Seal Your Waifu Bot frontend.

          - Author: bisug
          - Repository: https://github.com/bisug/seal-your-waifu-bot
          - Commit imported: ${SEAL_SHA}
          - License: ../THIRD_PARTY_LICENSES/SEAL_YOUR_WAIFU_LICENSE.txt

          The Source Baltigo version is progressively adapted to its own backend, catalog, branding and game systems.
          EOF

          python - <<'PY'
          from pathlib import Path
          import json

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['name'] = 'source-baltigo-miniapp'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('frontend/index.html')
          text = index_path.read_text(encoding='utf-8')
          text = text.replace('<title>SEAL YOUR WAIFU</title>', '<title>SOURCE BALTIGO</title>')
          index_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate imported frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run type-check
          bun run build

      - name: Commit imported frontend
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-seal-frontend-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: importar frontend do Seal como base do Source 2.0"
          git push origin HEAD:v2/seal-fusion
