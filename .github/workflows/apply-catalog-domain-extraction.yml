name: Apply catalog domain extraction

on:
  push:
    branches:
      - v2/p1-catalog-domain
    paths:
      - .github/workflows/apply-catalog-domain-extraction.yml
      - .github/scripts/apply_catalog_extraction.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/p1-catalog-domain
          fetch-depth: 0

      - name: Install test runner
        run: python -m pip install -q pytest

      - name: Apply surgical extraction
        run: python .github/scripts/apply_catalog_extraction.py

      - name: Compile and test catalog domain
        run: |
          python -m compileall -q webapp.py webapp_entrypoint.py webapp_routes webapp_services utils
          python -m pytest -q \
            tests/test_catalog_records.py \
            tests/test_catalog_service.py \
            tests/test_catalog_domain_architecture.py \
            tests/test_terms_domain_architecture.py \
            tests/test_webapp_route_modularization.py

      - name: Commit final refactor
        run: |
          rm .github/workflows/apply-catalog-domain-extraction.yml
          rm .github/scripts/apply_catalog_extraction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrair domínio combinado de Catálogo [catalog-domain-extracted]"
          git push origin HEAD:v2/p1-catalog-domain
