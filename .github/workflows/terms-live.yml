name: Terms live check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Railway deployment and test Terms membership backend
        shell: bash
        run: |
          set -u
          BASE="https://bot-production-1980.up.railway.app"
          echo "Testing $BASE"

          code=""
          body=""
          for attempt in $(seq 1 24); do
            body=$(curl -sS --max-time 12 -w '\n%{http_code}' "$BASE/api/channel/selftest" || true)
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "attempt=$attempt status=$code payload=$payload"
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              break
            fi
            sleep 10
          done

          echo "SELFTEST_HTTP=$code"
          echo "SELFTEST_BODY=$payload"

          echo "Testing POST route with intentionally invalid UID..."
          curl -sS -i --max-time 12 \
            -X POST "$BASE/api/channel/check" \
            -H 'Content-Type: application/json' \
            --data '{"uid":0}'

          if [ "$code" = "200" ]; then
            exit 0
          fi
          exit 1
