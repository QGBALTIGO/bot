name: Locate active home programming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-programming-last-definition.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locate active definitions and exact copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          for filename in ['premium_webapp_ui.py','webapp.py']:
              text=Path(filename).read_text(encoding='utf-8')
              lines=text.splitlines()
              tree=ast.parse(text, filename=filename)
              print(f'===== {filename} =====')
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      n=node.name.casefold()
                      if any(k in n for k in ['home','program','air','season','schedule']):
                          print('DEF',node.name,'LINE',node.lineno,'END',getattr(node,'end_lineno',node.lineno))
              for i,line in enumerate(lines,1):
                  low=line.casefold()
                  if any(k in low for k in ['o mesmo card','versão paralela','versao paralela','temporada atual','próximos episódios','proximos episodios','programação','programacao','imagem indispon','título indispon','titulo indispon','nextairing','airing']):
                      print(f'MATCH {i}: {line.strip()}')
          PY
      - name: Print active blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          for filename in ['premium_webapp_ui.py','webapp.py']:
              text=Path(filename).read_text(encoding='utf-8')
              lines=text.splitlines()
              tree=ast.parse(text, filename=filename)
              targets=[]
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and any(k in node.name.casefold() for k in ['home','program','airing']):
                      targets.append(node)
              for node in targets[-8:]:
                  start=max(1,node.lineno-8); end=min(len(lines),getattr(node,'end_lineno',node.lineno)+8)
                  if end-start > 260: end=start+260
                  print(f'\n--- {filename}:{start}-{end} {node.name} ---')
                  for n in range(start,end+1): print(f'{n:05d}: {lines[n-1]}')
          PY
      - name: Remove workflow
        run: |
          rm -f .github/workflows/home-programming-last-definition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/home-programming-last-definition.yml
          git commit -m 'Remove active home diagnostic workflow'
          git push origin HEAD:main
