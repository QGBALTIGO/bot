name: AniNexus media admin once

on:
  push:
    branches:
      - v2/aninexus-social-admin-media

permissions:
  contents: write

concurrency:
  group: aninexus-media-admin-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/aninexus-social-admin-media

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Align drawer matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/wire_aninexus_media_admin.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "{ id: 'upload', label: 'Cadastro', icon: UploadCloud },",
              "{ id: 'upload', label: 'Cadastro', icon: Satellite },",
          )
          text = text.replace(
              "{ id: 'upload', label: 'Artes 2:3', icon: UploadCloud },",
              "{ id: 'upload', label: 'Artes 2:3', icon: Satellite },",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Wire media admin
        run: python scripts/wire_aninexus_media_admin.py

      - name: Fix strict TypeScript array guard
        run: python scripts/fix_media_admin_ts.py

      - name: Install frontend dependencies
        working-directory: aninexus_frontend
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: aninexus_frontend
        run: bun run build

      - name: Publish runtime
        run: |
          rm -rf aninexus_runtime
          cp -R aninexus_frontend/dist aninexus_runtime
          diff -qr aninexus_frontend/dist aninexus_runtime

      - name: Compile Python
        run: python -m compileall -q .

      - name: Remove one-time files
        run: |
          rm -f scripts/wire_aninexus_media_admin.py
          rm -f scripts/fix_media_admin_ts.py
          rm -f .github/workflows/aninexus-media-admin-once.yml

      - name: Commit generated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrar painel de artes 2:3 ao AniNexus'
          git push origin HEAD:v2/aninexus-social-admin-media
