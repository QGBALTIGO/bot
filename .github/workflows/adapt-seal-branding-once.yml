name: Adapt Seal branding once

on:
  push:
    branches:
      - v2/seal-fusion
    paths:
      - .github/workflows/adapt-seal-branding-once.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/seal-fusion
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Replace visible upstream branding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'frontend/src/utils/index.ts': [
                  (">SEAL</text>", ">SOURCE</text>"),
              ],
              'frontend/src/components/Header.tsx': [
                  ("{botName || 'SEAL'}", "{botName || 'SOURCE'}"),
              ],
              'frontend/src/components/IntroLoading.tsx': [
                  ('>SEAL</span>', '>SOURCE</span>'),
              ],
              'frontend/src/components/ui/ErrorState.tsx': [
                  ('Could not reach the SEAL server. Check your connection and retry.',
                   'Não foi possível acessar o servidor do Source. Verifique sua conexão e tente novamente.'),
              ],
              'frontend/src/pages/Forbidden.tsx': [
                  ('This area is limited to the SEAL team.', 'Esta área é restrita à equipe Source.'),
              ],
              'frontend/src/pages/Leaderboard.tsx': [
                  ('seal-token.${token}', 'source-token.${token}'),
              ],
              'frontend/src/pages/Referrals.tsx': [
                  ('Join me on SEAL — hatch and collect anime waifus. Starter perks for new ',
                   'Vem para o Source Baltigo — colecione personagens, jogue e evolua sua coleção. Benefícios para novos '),
              ],
              'frontend/src/pages/ServerError.tsx': [
                  ('The SEAL server hit an error. Try again in a moment.',
                   'O servidor do Source encontrou um erro. Tente novamente em instantes.'),
              ],
          }

          for raw_path, pairs in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing branding marker in {raw_path}: {old!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no branding changes in {raw_path}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run type-check
          bun run build

      - name: Commit branding adaptation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/adapt-seal-branding-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adaptar branding do frontend Seal para Source"
          git push origin HEAD:v2/seal-fusion
