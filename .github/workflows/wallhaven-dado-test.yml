name: Wallhaven Dado portrait test

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_wallhaven_dado_test.py"
      - ".github/workflows/wallhaven-dado-test.yml"

permissions:
  contents: write

jobs:
  test-and-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install httpx

      - name: Prove Wallhaven 2x3 search works
        run: |
          python - <<'PY'
          import httpx
          params = {
              "q": "Frieren Sousou no Frieren",
              "categories": "010",
              "purity": "100",
              "sorting": "relevance",
              "order": "desc",
              "atleast": "1000x1500",
              "ratios": "2x3",
              "page": "1",
          }
          r = httpx.get(
              "https://wallhaven.cc/api/v1/search",
              params=params,
              headers={"User-Agent": "SourceBaltigo-Wallhaven-Smoke/1.0"},
              timeout=20,
              follow_redirects=True,
          )
          print("status=", r.status_code)
          print("url=", r.request.url)
          r.raise_for_status()
          payload = r.json()
          items = payload.get("data") or []
          print("results=", len(items))
          if not items:
              raise SystemExit("Wallhaven returned no 2:3 Frieren results")
          good = []
          for item in items:
              w = int(item.get("dimension_x") or 0)
              h = int(item.get("dimension_y") or 0)
              ratio = (w / h) if h else 0
              if w < h and abs(ratio - (2/3)) <= 0.12 and item.get("purity") == "sfw":
                  good.append((item.get("id"), w, h, round(ratio, 4), item.get("path")))
          print("accepted=", len(good))
          for row in good[:5]:
              print(row)
          if not good:
              raise SystemExit("Wallhaven returned results, but none fit Baltigo 2:3 rules")
          PY

      - name: Wire resolver into Dado reward
        run: python scripts/apply_wallhaven_dado_test.py

      - name: Validate Python
        run: |
          python -m compileall -q webapp.py utils/character_image_resolver.py
          git diff --check
          grep -q "resolve_character_portrait" webapp.py
          grep -q '"ratios": "2x3"' utils/character_image_resolver.py

      - name: Remove one-shot files
        run: rm -f scripts/apply_wallhaven_dado_test.py .github/workflows/wallhaven-dado-test.yml

      - name: Commit tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use Wallhaven 2x3 portraits for Dado characters"
          git push origin HEAD:main
