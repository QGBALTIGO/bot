name: Live global portrait catalog check

on:
  push:
    paths:
      - '.github/workflows/live-global-portrait-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx pillow
      - name: Verify catalog returns canonical exact portrait
        run: |
          python - <<'PY'
          import io,time
          import httpx
          from PIL import Image

          base='https://bot-production-1980.up.railway.app'
          headers={'User-Agent':'SourceBaltigo-Live-Global-Portrait/1.0'}
          with httpx.Client(timeout=30,follow_redirects=True,headers=headers) as client:
            last=None
            for attempt in range(18):
              r=client.get(base+'/api/cards/search',params={'q':'Luffy','limit':20})
              print('SEARCH',attempt+1,r.status_code,r.text[:700] if r.status_code!=200 else '')
              if r.status_code==200:
                items=(r.json() or {}).get('items') or []
                target=next((x for x in items if int(x.get('id') or 0)==40),None)
                print('TARGET',target)
                if target:
                  image=str(target.get('image') or '')
                  if image.startswith(base+'/api/image-proxy?crop=portrait&url='):
                    ir=client.get(image)
                    print('IMAGE',ir.status_code,ir.headers.get('x-image-crop'),ir.headers.get('content-type'),len(ir.content))
                    if ir.status_code==200:
                      with Image.open(io.BytesIO(ir.content)) as im:
                        w,h=im.size
                        print('DIMENSIONS',w,h,'RATIO',w/h)
                        assert w*3==h*2, (w,h)
                        assert ir.headers.get('x-image-crop')=='2:3'
                        break
              time.sleep(10)
            else:
              raise SystemExit('live catalog did not expose canonical 2x3 Luffy portrait')
          PY
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/live-global-portrait-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove global portrait live check'
          git push origin HEAD:main
