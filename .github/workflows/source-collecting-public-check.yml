name: Source collecting public verification
on:
  push:
    branches: [codex/source-collecting-evolution-20260925]
    paths: ['.github/workflows/source-collecting-public-check.yml']
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public build and authentication boundary without transactions
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, hashlib, pathlib
          BASE='https://bot-production-1980.up.railway.app'
          rows=[]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          http=urllib.request.build_opener(NoRedirect())
          def get(path,expected):
              req=urllib.request.Request(BASE+path,headers={'User-Agent':'Source-Collecting-ReadOnly-Smoke/1.0','Cache-Control':'no-cache'})
              try:
                  with http.open(req,timeout=20) as response: status=response.status; headers=response.headers; body=response.read(512000)
              except urllib.error.HTTPError as exc:
                  status=exc.code; headers=exc.headers; body=exc.read(512000)
              rows.append({'path':path,'status':status,'location':headers.get('Location'),'cache_control':headers.get('Cache-Control'),'body_sha256':hashlib.sha256(body).hexdigest()})
              assert status==expected,(path,status)
              return body
          result={'commit':'b8e348926aaea53862f9559a723342e4b23468ca','scope':'Public GET only; no credentials, user identities, transactions or database writes','checks':rows}
          try:
              get('/health',200)
              version=json.loads(get('/ui-version.json',200))
              assert version=={'version':'63a180850c749b0e','entrypoint':'/menu'},version
              result['version']=version
              home=get('/menu',200)
              for tab in ['collecting','workshop','marketplace','events','activity','help','identify','dice_info']:
                  page=get('/menu?tab='+tab,200)
                  assert page==home,'Different HTML shell '+tab
              for alias in ['/shop','/cards']:
                  get(alias,307)
                  assert '/menu' in rows[-1]['location']
              get('/api/v1_7b82/collecting/settings',401)
              result['passed']=True
          finally:
              pathlib.Path('public-check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-collecting-public-check
          path: public-check.json
          retention-days: 7
